<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}
.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}
.r{display:flex;gap:6px;margin-bottom:8px}
.b{flex:1;padding:10px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700}
.on{border-color:#fc0;background:#fff9db}
#w{height:300px;background:#e5e9ec;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}
.p{position:absolute;font-size:26px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}
#st2{position:absolute;left:6px;bottom:6px;z-index:9;background:#fff;padding:2px 6px;border-radius:5px;font-size:11px}
.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}
</style>
</head>
<body>
<div class="c">
<div class="r">
<button class="b on" id="b1" onclick="setP(1)">2ГИС</button>
<button class="b" id="b2" onclick="setP(2)">ArcGIS</button>
<button class="b" id="b3" onclick="setP(3)">OSM</button>
</div>
<div id="st" style="text-align:center;font-weight:700;margin-bottom:6px">Точка А: нажмите на карту</div>
<div id="w">
<div id="ly" style="position:absolute;inset:0"></div>
<div id="mA" class="p">🟢</div>
<div id="mB" class="p">🔴</div>
<div style="position:absolute;right:6px;top:6px;z-index:9"><button onclick="z++;draw()">+</button><button onclick="z--;draw()">-</button></div>
<div id="st2">Жду JS...</div>
</div>
<div class="r">
<button class="b on" id="btA" onclick="setM(1)">🟢 Точка А</button>
<button class="b" id="btB" onclick="setM(2)">🔴 Точка Б</button>
</div>
<div class="r">
<button class="b on" id="t1" onclick="setT(1)">Эконом <span id="p1">150 ₽</span></button>
<button class="b" id="t2" onclick="setT(2)">Комфорт <span id="p2">225 ₽</span></button>
</div>
<button class="go" onclick="st.innerText=tO.innerText">Заказать такси</button>
<span id="tA" hidden>Точка А: нажмите на карту</span>
<span id="tB" hidden>Точка Б: нажмите на карту</span>
<span id="tO" hidden>Заказ принят!</span>
<span id="u1" hidden>https://2gis.com?</span>
<span id="u2" hidden>https://arcgisonline.com</span>
<span id="u3" hidden>https://openstreetmap.org</span>
<span id="s0" hidden>position:absolute;width:256px;height:256px;pointer-events:none;</span>
<span id="sOk" hidden>OK: </span>
<span id="sEr" hidden>ERR: </span>
<span id="cls" hidden>on</span>
</div>
<script>
var m=1,pr=1,z=14,cLa=56.4475,cLn=60.1895,laA=56.4426,lnA=60.1819,laB=56.4530,lnB=60.1980;
function px(la,ln){var n=1<<z,r=la*Math.PI/180;return{x:(ln+180)/360*n*256,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256};}
function ll(x,y){var n=1<<z,a=Math.PI-2*Math.PI*y/(n*256);return{la:180/Math.PI*Math.atan(.5*(Math.exp(a)-Math.exp(-a))),ln:x/(n*256)*360-180};}
function setP(v){pr=v;var c=cls.innerText;b1.classList.toggle(c,v==1);b2.classList.toggle(c,v==2);b3.classList.toggle(c,v==3);draw();}
function setM(v){m=v;var c=cls.innerText;btA.classList.toggle(c,v==1);btB.classList.toggle(c,v==2);st.innerText=(v==1?tA:tB).innerText;}
function setT(v){var c=cls.innerText;t1.classList.toggle(c,v==1);t2.classList.toggle(c,v==2);}
function draw(){
  var W=w.clientWidth||340,H=w.clientHeight||300,c=px(cLa,cLn),x0=c.x-W/2,y0=c.y-H/2,mx=1<<z,ok=0,er=0;
  ly.innerHTML=ly.title;
  var tx0=Math.floor(x0/256),tx1=Math.floor((x0+W)/256),ty0=Math.floor(y0/256),ty1=Math.floor((y0+H)/256);
  for(var tx=tx0;tx<=tx1;tx++){
    for(var ty=ty0;ty<=ty1;ty++){
      if(ty>=0){
        if(mx>ty){
          var wx=((tx%mx)+mx)%mx,im=new Image();
          im.style.cssText=s0.innerText;
          im.style.left=(tx*256-x0)+pxU.innerText;
          im.style.top=(ty*256-y0)+pxU.innerText;
          im.onload=function(){ok++;st2.innerText=sOk.innerText+ok;};
          im.onerror=function(){er++;st2.innerText=sEr.innerText+er;};
          if(pr==1)im.src=u1.innerText+qX.innerText+wx+qY.innerText+ty+qZ.innerText+z;
          if(pr==2)im.src=u2.innerText+z+sl.innerText+ty+sl.innerText+wx;
          if(pr==3)im.src=u3.innerText+z+sl.innerText+wx+sl.innerText+ty+png.innerText;
          ly.appendChild(im);
        }
      }
    }
  }
  var a=px(laA,lnA),b=px(laB,lnB);
  mA.style.left=(a.x-x0)+pxU.innerText;mA.style.top=(a.y-y0)+pxU.innerText;
  mB.style.left=(b.x-x0)+pxU.innerText;mB.style.top=(b.y-y0)+pxU.innerText;
}
var sx=0,sy=0,mv=0,sla=0,sln=0;
w.onpointerdown=function(e){sx=e.clientX;sy=e.clientY;mv=0;sla=cLa;sln=cLn;};
w.onpointermove=function(e){if(sx){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>6)mv=1;if(Math.abs(dy)>6)mv=1;if(mv){var c=px(sla,sln),p=ll(c.x-dx,c.y-dy);cLa=p.la;cLn=p.ln;draw();}}};
w.onpointerup=function(e){if(sx){if(mv==0){var r=w.getBoundingClientRect(),c=px(cLa,cLn),p=ll(c.x-r.width/2+e.clientX-r.left,c.y-r.height/2+e.clientY-r.top);if(m==1){laA=p.la;lnA=p.ln;setM(2);}else{laB=p.la;lnB=p.ln;}draw();var km=Math.hypot((laB-laA)*111,(lnB-lnA)*61)*1.3,v=Math.max(100,Math.round(80+km*28));p1.innerText=v+rub.innerText;p2.innerText=Math.round(v*1.5)+rub.innerText;}sx=0;}};
</script>
<span id="pxU" hidden>px</span><span id="qX" hidden>x=</span><span id="qY" hidden>&y=</span><span id="qZ" hidden>&z=</span><span id="sl" hidden>/</span><span id="png" hidden>.png</span><span id="rub" hidden> ₽</span>
<script>draw();</script>
</body>
</html>
