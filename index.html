<!DOCTYPE html><html><head><title>Такси Север-Юг</title><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no><meta name=referrer content=no-referrer>
<style>body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}.r{display:flex;gap:6px;margin-bottom:8px}.b{flex:1;padding:9px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700;font-size:13px}.on{border-color:#fc0;background:#fff9db}#w{height:260px;background:#e5e9ec;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}.p{position:absolute;font-size:26px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}#st2{position:absolute;left:6px;bottom:6px;z-index:9;background:#fff;padding:2px 6px;border-radius:5px;font-size:11px}.ir{display:flex;gap:4px;margin-bottom:6px}.inp{flex:1;padding:9px 10px;border:2px solid #ddd;border-radius:9px;font-size:13px;outline:none}.inp:focus{border-color:#fc0}.sbtn{padding:0 12px;border:2px solid #ddd;border-radius:9px;background:#f8f9fa;font-size:15px}.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}</style></head>
<body><div class=c><div style="text-align:center;font-weight:800;font-size:16px;margin-bottom:6px">🚕 Такси «Север-Юг»</div>
<div class=r><button class='b on' id=b1 onclick='setP(1)'>OSM (Дома)</button><button class=b id=b2 onclick='setP(2)'>ArcGIS</button></div>
<div id=st style=text-align:center;font-weight:700;margin-bottom:6px;font-size:14px>Точка А: нажмите на карту или введите адрес</div>
<div id=w><div id=ly style=position:absolute;inset:0></div><div id=mA class=p>🟢</div><div id=mB class=p>🔴</div><div style=position:absolute;right:6px;top:6px;z-index:9><button onclick='zm(1)'>+</button><button onclick='zm(-1)'>-</button></div><div id=st2>Старт</div></div>
<div class=ir><input id=aA class=inp placeholder='🟢 Откуда (улица, дом)' onkeydown='if(event.keyCode==13)findAdr(1)'><button class=sbtn onclick='findAdr(1)'>🔍</button></div>
<div class=ir><input id=aB class=inp placeholder='🔴 Куда (улица, дом)' onkeydown='if(event.keyCode==13)findAdr(2)'><button class=sbtn onclick='findAdr(2)'>🔍</button></div>
<div class=r><button class='b on' id=btA onclick='setM(1)'>🟢 Точка А</button><button class=b id=btB onclick='setM(2)'>🔴 Точка Б</button><button class=b onclick='getGps()'>📍 GPS</button></div>
<div class=r><button class='b on' id=t1 onclick='setT(1)'>Эконом <span id=p1>150 ₽</span></button><button class=b id=t2 onclick='setT(2)'>Комфорт <span id=p2>225 ₽</span></button></div>
<button class=go onclick='st.textContent="Заказ принят!"'>Заказать такси</button></div>
<script>
var m=1,pr=1,z=15,city='Полевской',cLa=56.4475,cLn=60.1895,laA=56.4426,lnA=60.1819,laB=56.4530,lnB=60.1980,H='https:'+String.fromCharCode(47,47),AMP=String.fromCharCode(38);
function u(p,x,y,z){
  if(p==1)return H+'tile.openstreetmap'+'.org/'+z+'/'+x+'/'+y+'.png';
  return H+'server.arcgisonline'+'.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/'+z+'/'+y+'/'+x;
}
function px(la,ln){var n=1<<z,r=la*Math.PI/180;return{x:(ln+180)/360*n*256,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256};}
function ll(x,y){var n=1<<z,a=Math.PI-2*Math.PI*y/(n*256);return{la:180/Math.PI*Math.atan(.5*(Math.exp(a)-Math.exp(-a))),ln:x/(n*256)*360-180};}
function zm(d){var mx=(pr==2?15:18);z=Math.max(11,Math.min(mx,z+d));draw();}
function setP(v){pr=v;b1.classList.toggle('on',v==1);b2.classList.toggle('on',v==2);if(v==2){if(z>15)z=15;}draw();}
function setM(v){m=v;btA.classList.toggle('on',v==1);btB.classList.toggle('on',v==2);st.textContent=v==1?'Укажите Точку А (на карте или текстом)':'Укажите Точку Б (на карте или текстом)';}
function setT(v){t1.classList.toggle('on',v==1);t2.classList.toggle('on',v==2);}
function calc(){
  var km=Math.hypot((laB-laA)*111,(lnB-lnA)*61)*1.3;
  if(!isFinite(km))return;
  var v=Math.max(100,Math.round(80+km*28));
  p1.textContent=v+' ₽';p2.textContent=Math.round(v*1.5)+' ₽';
}
function geo(la,ln,who){
  var el=(who==1?aA:aB);el.value='Поиск адреса...';
  fetch(H+'nominatim.openstreetmap'+'.org/reverse?format=json'+AMP+'lat='+la+AMP+'lon='+ln)
  .then(function(r){return r.json();})
  .then(function(d){
    var a=d.address||{};
    if(a.city||a.town)city=a.city||a.town;
    el.value=(a.road||'Точка')+(a.house_number?', '+a.house_number:'');
  }).catch(function(){el.value=la.toFixed(5)+', '+ln.toFixed(5);});
}
function findAdr(who){
  var el=(who==1?aA:aB),q=el.value.trim();
  if(!q)return;
  st.textContent='Ищем: '+q+'...';
  var vb=(lnA-0.15)+','+(laA+0.15)+','+(lnA+0.15)+','+(laA-0.15);
  fetch(H+'nominatim.openstreetmap'+'.org/search?format=json'+AMP+'limit=1'+AMP+'bounded=1'+AMP+'viewbox='+vb+AMP+'q='+encodeURIComponent(city+', '+q))
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.length)return fetch(H+'nominatim.openstreetmap'+'.org/search?format=json'+AMP+'limit=1'+AMP+'q='+encodeURIComponent('Свердловская область, '+q)).then(function(r){return r.json();});
    return d;
  })
  .then(function(d){
    var it=d.shift();
    if(!it){st.textContent='Адрес не найден, уточните улицу';return;}
    var la=parseFloat(it.lat),ln=parseFloat(it.lon);
    if(!isFinite(la)||!isFinite(ln))return;
    cLa=la;cLn=ln;z=(pr==2?15:16);
    if(who==1){laA=la;lnA=ln;setM(2);}else{laB=la;lnB=ln;}
    draw();calc();
    st.textContent='Адрес найден!';
  }).catch(function(){st.textContent='Ошибка поиска адреса';});
}
function upd(la,ln){
  if(m==1){laA=la;lnA=ln;geo(la,ln,1);setM(2);}
  else{laB=la;lnB=ln;geo(la,ln,2);}
  draw();calc();
}
function getGps(){
  if(!navigator.geolocation){st.textContent='GPS недоступен';return;}
  st.textContent='Ищем вас по GPS...';
  navigator.geolocation.getCurrentPosition(function(pos){
    var la=pos.coords.latitude,ln=pos.coords.longitude;
    cLa=la;cLn=ln;m=1;upd(la,ln);
    st.textContent='Вы найдены! Выберите Точку Б';
  },function(){st.textContent='Включите геолокацию на телефоне';},{enableHighAccuracy:true,timeout:7000});
}
function draw(){
  var W=w.clientWidth||340,Ht=w.clientHeight||260,c=px(cLa,cLn),x0=c.x-W/2,y0=c.y-Ht/2,mx=1<<z,ok=0,er=0;
  ly.innerHTML='';
  for(var tx=Math.floor(x0/256);tx<=Math.floor((x0+W)/256);tx++){
    for(var ty=Math.floor(y0/256);ty<=Math.floor((y0+Ht)/256);ty++){
      if(ty>=0){if(mx>ty){
        var wx=((tx%mx)+mx)%mx,im=new Image();
        im.style.cssText='position:absolute;width:256px;height:256px;pointer-events:none;left:'+(tx*256-x0)+'px;top:'+(ty*256-y0)+'px';
        im.onload=function(){ok++;st2.textContent='OK: '+ok;};
        im.onerror=function(){er++;st2.textContent='ERR: '+er;};
        im.src=u(pr,wx,ty,z);ly.appendChild(im);
      }}
    }
  }
  var a=px(laA,lnA),b=px(laB,lnB);
  mA.style.left=(a.x-x0)+'px';mA.style.top=(a.y-y0)+'px';mB.style.left=(b.x-x0)+'px';mB.style.top=(b.y-y0)+'px';
}
var sx=0,sy=0,mv=0,sla=0,sln=0;
w.onpointerdown=function(e){sx=e.clientX;sy=e.clientY;mv=0;sla=cLa;sln=cLn;};
w.onpointermove=function(e){if(sx){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>6)mv=1;if(Math.abs(dy)>6)mv=1;if(mv){var c=px(sla,sln),p=ll(c.x-dx,c.y-dy);cLa=p.la;cLn=p.ln;draw();}}};
w.onpointerup=function(e){if(sx){if(mv==0){var r=w.getBoundingClientRect(),c=px(cLa,cLn),p=ll(c.x-r.width/2+e.clientX-r.left,c.y-r.height/2+e.clientY-r.top);upd(p.la,p.ln);}sx=0;}};
draw();getGps();
</script></body></html>
