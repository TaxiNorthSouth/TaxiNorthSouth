<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Такси Полевской</title>
<style>
body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}
.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}
.r{display:flex;gap:6px;margin-bottom:8px}
.b{flex:1;padding:10px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700}
.on{border-color:#fc0;background:#fff9db}
iframe{width:100%;height:320px;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;display:block}
input{width:100%;box-sizing:border-box;padding:10px;border:2px solid #ddd;border-radius:9px;margin-bottom:8px;font-size:14px}
.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}
</style>
</head>
<body>
<div class="c">
<div style="text-align:center;font-weight:700;margin-bottom:6px">Такси Полевской</div>
<iframe src="https://yandex.ru" frameborder="0" allowfullscreen="true"></iframe>
<input id="adrA" placeholder="🟢 Откуда (улица, дом)">
<input id="adrB" placeholder="🔴 Куда (улица, дом)">
<div class="r">
<button class="b on" id="t1" onclick="t1.className='b on';t2.className='b'">Эконом 150 ₽</button>
<button class="b" id="t2" onclick="t2.className='b on';t1.className='b'">Комфорт 225 ₽</button>
</div>
<button class="go" onclick="this.innerText='Заказ отправлен!'">Заказать такси</button>
</div>
</body>
</html>
