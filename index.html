let cLat=56.8389,cLon=60.6057,z=15,tr=1,pts=[null,null],cur=0,actId=null,curCity="Екатеринбург",carPt=null,pollTmr=null;
const w=document.getElementById('w'),ly=document.getElementById('ly'),pins=document.getElementById('pins'),st=document.getElementById('st');

function l2t(la,lo,zm){const n=1<<zm,r=la*Math.PI/180;return{x:(lo+180)/360*n,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n};}
function t2l(x,y,zm){const n=1<<zm,r=Math.atan(Math.sinh(Math.PI*(1-2*y/n)));return{lat:r*180/Math.PI,lon:x/n*360-180};}
function draw(){
  const W=w.clientWidth||320,H=w.clientHeight||240,c=l2t(cLat,cLon,z),m=1<<z;ly.innerHTML='';
  for(let x=Math.floor(c.x-W/512);x<=Math.floor(c.x+W/512);x++)for(let y=Math.floor(c.y-H/512);y<=Math.floor(c.y+H/512);y++){
    if(y<0||y>=m)continue;const wx=((x%m)+m)%m,im=document.createElement('img');
    im.src=U1+z+'/'+wx+'/'+y+'.png';
    im.style.cssText='position:absolute;left:'+Math.round(W/2+(x-c.x)*256)+'px;top:'+Math.round(H/2+(y-c.y)*256)+'px;width:256px;height:256px;pointer-events:none';
    ly.appendChild(im);

  pins.innerHTML='';
  if(carPt){const cp=l2t(carPt.lat,carPt.lon,z),cd=document.createElement('div');cd.className='p';cd.textContent='🚕';cd.style.left=(W/2+(cp.x-c.x)*256)+'px';cd.style.top=(H/2+(cp.y-c.y)*256)+'px';pins.appendChild(cd);}
  pts.forEach((p,i)=>{if(!p)return;const tp=l2t(p.lat,p.lon,z),d=document.createElement('div');d.className='p';d.textContent=i===0?'🟢':(i===pts.length-1?'🔴':'🟡');d.style.left=(W/2+(tp.x-c.x)*256)+'px';d.style.top=(H/2+(tp.y-c.y)*256)+'px';pins.appendChild(d);});
  if(!carPt)freeCars.forEach(c=>{const tp=l2t(c.la,c.lo,z),d=document.createElement('div');d.className='p';d.style.zIndex='400';d.innerHTML='🚕<div style="font-size:9px;background:#fff;padding:1px 3px;border-radius:3px;white-space:nowrap">'+c.c+'</div>';d.style.left=(W/2+(tp.x-c.x)*256)+'px';d.style.top=(H/2+(tp.y-c.y)*256)+'px';pins.appendChild(d);});
document.getElementById('st2').textContent='v27 z'+z;calc();
}
function setT(v){tr=v;document.getElementById('t1').classList.toggle('on',v===1);document.getElementById('t2').classList.toggle('on',v===2);}

let dg=false,mv=false,sx=0,sy=0;

window.addEventListener('pointerup',e=>{if(!dg)return;dg=false;if(!mv&&(!actId||editRide)&&e.target.tagName!=='BUTTON'){const r=w.getBoundingClientRect(),c=l2t(cLat,cLon,z),p=t2l(c.x+(e.clientX-r.left-w.clientWidth/2)/256,c.y+(e.clientY-r.top-w.clientHeight/2)/256,z);setPt(cur,p.lat,p.lon,true);if(cur<pts.length-1)cur++;}});
async function setPt(i,la,lo,rv){pts[i]={lat:la,lon:lo};draw();if(!rv)return;st.textContent='Определяем адрес...';try{const r=await fetch(NOM+'reverse?format=json&lat='+la+'&lon='+lo+'&accept-language=ru'),d=await r.json(),a=d.address||{},rd=a.road||a.pedestrian||a.suburb||'',hs=a.house_number?(', '+a.house_number):'';if(a.city||a.town||a.village)curCity=a.city||a.town||a.village;document.getElementById('in'+i).value=rd?(rd+hs):(la.toFixed(5)+', '+lo.toFixed(5));st.textContent='Точка установлена';}catch{document.getElementById('in'+i).value=la.toFixed(5)+', '+lo.toFixed(5);}}
async function findAdr(i){
  cur=i;const q=document.getElementById('in'+i).value.trim();if(!q)return;
  st.textContent='Ищем...';
  try{
    let r=await fetch(NOM+'search?format=json&limit=1&countrycodes=ru&q='+encodeURIComponent(curCity+', '+q)+'&accept-language=ru');
    let a=await r.json();
    if(!a||!a.length){r=await fetch(NOM+'search?format=json&limit=1&countrycodes=ru&q='+encodeURIComponent(q)+'&accept-language=ru');a=await r.json();}
    const item=a&&a.at(0);
    if(item&&item.lat){cLat=parseFloat(item.lat);cLon=parseFloat(item.lon);pts[i]={lat:cLat,lon:cLon};draw();st.textContent='Найдено';}
    else st.textContent='Не найдено';
  }catch(e){st.textContent='Ошибка: '+e.message;}
}
function addPt(){if(pts.length>=5)return alert('Максимум 5 точек');const i=pts.length;pts.push(null);const d=document.createElement('div');d.className='ir';d.innerHTML='<input id=in'+i+' class=inp placeholder="🟡 Точка '+i+'" onfocus="cur='+i+'"><button class=sbtn onclick="findAdr('+i+')">🔍</button>';document.getElementById('ptsBox').appendChild(d);cur=i;}
function getGps(){if(!navigator.geolocation)return alert('Нет GPS');st.textContent='Ищем GPS...';navigator.geolocation.getCurrentPosition(p=>{cLat=p.coords.latitude;cLon=p.coords.longitude;setPt(0,cLat,cLon,true);},()=>{st.textContent='Ошибка GPS';},{enableHighAccuracy:true,timeout:8000});}
let ttSeq=0;
function applyPrices(km,mins,del){
  rKm=Math.round(km*10)/10;rMin=mins;
  const p1=Math.max(150,Math.round((150+Math.max(0,rKm-2)*25+del*5)/5)*5);
  const p2=Math.max(225,Math.round((225+Math.max(0,rKm-2)*35+del*6)/5)*5);
  document.getElementById('p1').textContent=p1+' ₽';
  document.getElementById('p2').textContent=p2+' ₽';
  let inf=document.getElementById('rtInf');
  if(!inf){inf=document.createElement('div');inf.id='rtInf';inf.style.cssText='font-size:12px;color:#475569;text-align:center;margin:4px 0 6px;font-weight:600';const t1=document.getElementById('t1');if(t1&&t1.parentNode)t1.parentNode.after(inf);}
  inf.textContent=rKm>0?(`🛣 ${rKm} км • ⏱ ${rMin} мин`+(del>0?` (пробки +${del} мин)`:' (без пробок)')):'';
}
async function calc(){
  const valid=pts.filter(Boolean);
  let km=0;for(let i=0;i<pts.length-1;i++)if(pts[i]&&pts[i+1]){const R=6371,dLa=(pts[i+1].lat-pts[i].lat)*Math.PI/180,dLo=(pts[i+1].lon-pts[i].lon)*Math.PI/180,s=Math.sin(dLa/2)**2+Math.cos(pts[i].lat*Math.PI/180)*Math.cos(pts[i+1].lat*Math.PI/180)*Math.sin(dLo/2)**2;km+=R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))*1.25;}
  applyPrices(km,km>0?Math.max(2,Math.round(km*2.2)):0,0);
  if(valid.length<2)return;
  const seq=++ttSeq;
  try{
    const loc=valid.map(c=>c.lat+','+c.lon).join(':');
    const tk='5hyOFoUuoVROVRk3'+'kpiJBBUrhp7sPqM8';
    const u='https://'+'://tomtom.com'+'/routing/1/calculateRoute/'+loc+'/json?traffic=true&travelMode=car&key='+tk;
    const r=await fetch(u);const d=await r.json();
    if(seq!==ttSeq||!d.routes||!d.routes.length)return;
    const sm=d.routes.summary;
    const tKm=sm.lengthInMeters/1000;
    const tMin=Math.max(1,Math.round(sm.travelTimeInSeconds/60));
    const tDel=Math.max(0,Math.round((sm.trafficDelayInSeconds||0)/60));
    applyPrices(tKm,tMin,tDel);
  }catch(e){}
}

const TG_BASE="https://"+"api.telegram.org/bot8202523047:"+"AAHHpOewNLvmPzz8DyRXWAbEqpdMKQIWafo/";

async function syncChannel(){try{const r=await fetch(TG_BASE+'getChat?chat_id='+SYNC_CH+'&t='+Date.now());const j=await r.json();if(!j.ok||!j.result||!j.result.description)return;const cur=JSON.parse(j.result.description);if(cur.fleet){document.getElementById('fcnt').textContent='• 🟢 На линии: '+cur.fleet.cnt;freeCars=cur.fleet.cars||[];if(!carPt)draw();}if(!actId)return;const d=cur['taxi_ns_out_'+actId];if(!d)return;if(d.lat&&d.lon){carPt={lat:d.lat,lon:d.lon};draw();}if(d.text){st.textContent=d.text;const curS=JSON.parse(localStorage.getItem('ns_ord')||'{}');curS.status=d.text;saveState(curS);}if(d.st==='arr'&&d.arr_ts){startWebWait(d.arr_ts,d.free_m||2,d.rate||5);}if(d.st==='riding'){if(waitTmr){clearInterval(waitTmr);waitTmr=null;}unlockRideEdit();}if(d.st==='canc'||d.st==='done'){resetOrderUI(d.text||'Заказ завершён');}}catch{}}
function startPoll(id){lockOrderUI(true);if(pts&&pts[0]){cLat=pts[0].lat;cLon=pts[0].lon;z=16;draw();}if(pollTmr)clearInterval(pollTmr);syncChannel();pollTmr=setInterval(syncChannel,2500);}

function lockOrderUI(lk){document.querySelectorAll('#ptsBox input,#ptsBox button,button[onclick="addPt()"],button[onclick="getGps()"],#t1,#t2,#t3,#phInp').forEach(el=>{el.disabled=lk;el.style.opacity=lk?'0.5':'1';});}

async function ensureCoords(){const k='e0c62c89-9513-49f3-'+'b431-44a2f25755bd';let ch=false;for(let i=0;i<pts.length;i++){const el=document.getElementById('in'+i);const v=el?el.value.trim():'';if(v&&!pts[i]){try{const q=encodeURIComponent(v.toLowerCase().includes('екатеринбург')?v:'Екатеринбург, '+v);const r=await fetch('https://'+'geocode-maps.yandex.ru/1.x/?apikey='+k+'&format=json&results=1&geocode='+q);const j=await r.json();const pos=j.response.GeoObjectCollection.featureMember[0].GeoObject.Point.pos.split(' ');pts[i]={lat:parseFloat(pos[1]),lon:parseFloat(pos[0])};ch=true;}catch(e){}}}if(ch){await calc();draw();}}
async function sendOrd(){
if(!actId)await ensureCoords();
  const btn=document.getElementById('obtn');
  if(actId){
    const oldId=actId;
    await sendCh({act:'canc',oid:oldId}).catch(()=>{});

  }

  const tc=tr===1?'econom':'comfort';
  const tn=(tr===1?'Эконом':'Комфорт')+' ('+document.getElementById(tr===1?'p1':'p2').textContent+')';

  }catch(e){
    actId=null;alert('Ошибка отправки: '+e.message);btn.className='go';btn.textContent='Заказать такси';

})();

<script>

              <div><div style='font-size:16px;font-weight:800;color:#4ade80'>${d.d.ok}</div><div style='font-size:11px;color:#cbd5e1'>Выполнено</div></div>
              <div><div style='font-size:16px;font-weight:800;color:#f87171'>${d.d.no}</div><div style='font-size:11px;color:#cbd5e1'>Отменено</div></div>
              <div><div style='font-size:16px;font-weight:800;color:#facc15'>${avg} ₽</div><div style='font-size:11px;color:#cbd5e1'>Ср. чек</div></div>
            </div>
            <div style='margin-top:10px;font-size:11px;color:#94a3b8;display:flex;justify-content:space-between'><span>Успешность поездок</span><span>${pct}%</span></div>
            <div style='height:5px;background:rgba(255,255,255,.15);border-radius:4px;margin-top:4px;overflow:hidden'><div style='height:100%;width:${pct}%;background:#4ade80'></div></div>
          </div>`;
        }
        out+=`<div style='font-size:14px;font-weight:800;color:#1e293b;margin-bottom:8px'>🧾 История поездок пассажира</div>`;
        if(!d.p||!d.p.length){out+=`<div style='background:#fff;border-radius:14px;padding:16px;text-align:center;color:#64748b;border:1px solid #e2e8f0'>По этому номеру поездок пока нет</div>`;}
        else{
          const stM={done:['✅ Выполнен','#dcfce7','#166534'],canc:['❌ Отменён','#fee2e2','#991b1b'],riding:['▶️ В пути','#dbeafe','#1e40af'],acc:['🚕 Едет','#fef9c3','#854d0e'],search:['🔍 Поиск','#f1f5f9','#475569']};
          out+=d.p.map(x=>{
            const st=stM[x[4]]||[x[4],'#f1f5f9','#475569'];
            return `<div style='background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid #e2e8f0;box-shadow:0 2px 6px rgba(0,0,0,.03)'>
              <div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'>
                <span style='font-weight:800;color:#0f172a;font-size:13px'>Заказ #${x[0]}</span>
                <span style='background:${st[1]};color:${st[2]};font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px'>${st[0]}</span>
              </div>
              <div style='font-size:13px;color:#334155;margin-bottom:3px'>🟢 ${x[1]}</div>
              <div style='font-size:13px;color:#334155;margin-bottom:8px'>🔴 ${x[2]}</div>
              <div style='display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #e2e8f0;padding-top:8px'>
                <span style='font-weight:800;color:#0f172a;font-size:13px'>${x[3]}</span>
                <button onclick="repTrip('${x[1].replace(/'/g,'')}','${x[2].replace(/'/g,'')}')" style='border:none;background:#f1f5f9;color:#0f172a;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;cursor:pointer'>🔄 Повторить</button>
              </div>
            </div>`;
          }).join('');
        }
        b.innerHTML=out;return;
      }
    }catch(e){}
  }
  b.innerHTML='<div style="text-align:center;padding:16px;color:#ef4444">Бот не ответил вовремя. Нажмите «Найти» ещё раз.</div>';
}
</script>
</body></html>
