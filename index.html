<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1><meta name=referrer content=no-referrer><title>Такси Север-Юг</title>
<style>body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}.r{display:flex;gap:6px;margin-bottom:8px}.b{flex:1;padding:9px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700;font-size:13px}.on{border-color:#fc0;background:#fff9db}#w{height:240px;background:#e5e9ec;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}.p{position:absolute;font-size:24px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}#st2{position:absolute;left:6px;bottom:6px;z-index:9;background:#fff;padding:2px 6px;border-radius:5px;font-size:11px}.ir{display:flex;gap:4px;margin-bottom:6px}.inp{flex:1;padding:10px;border:2px solid #ddd;border-radius:9px;font-size:14px}.sbtn{padding:0 12px;border:2px solid #ddd;border-radius:9px;background:#f8f9fa}.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}.canc{width:100%;background:#ff4d4f;color:#fff;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}</style></head>
<body><div class=c><div style="text-align:center;font-weight:800;font-size:16px;margin-bottom:6px">🚕 Такси «Север-Юг»</div>
<div class=r><button class="b on" id=b1 onclick="setP(1)">OSM (Дома)</button><button class=b id=b2 onclick="setP(2)">ArcGIS</button></div>
<div id=st style="text-align:center;font-weight:700;margin-bottom:6px;font-size:13px">Укажите адреса маршрута</div>
<div id=w><div id=ly style="position:absolute;inset:0"></div><div id=pins></div><div style="position:absolute;right:6px;top:6px;z-index:9"><button onclick="zm(1)">+</button><button onclick="zm(-1)">-</button></div><div id=st2>v4</div></div>
<div id=ptsBox><div class=ir><input id=in0 class=inp placeholder="🟢 Откуда (улица, дом)"><button class=sbtn onclick="findAdr(0)">🔍</button></div><div class=ir><input id=in1 class=inp placeholder="🔴 Куда (улица, дом)"><button class=sbtn onclick="findAdr(1)">🔍</button></div></div>
<div class=r><button class=b onclick="addPt()">➕ Добавить точку</button><button class=b onclick="getGps()">📍 Мой GPS</button></div>
<div class=ir><input id=phInp class=inp type=tel placeholder="📱 Ваш телефон"></div>
<div class=r><button class="b on" id=t1 onclick="setT(1)">Эконом <span id=p1>150 ₽</span></button><button class=b id=t2 onclick="setT(2)">Комфорт <span id=p2>225 ₽</span></button></div>
<button class=go id=obtn onclick="sendOrd()">Заказать такси</button></div>
