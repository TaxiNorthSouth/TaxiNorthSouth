<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1><title>Такси Север-Юг</title>
<script src="https://telegram.org"></script>
<style>body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}.r{display:flex;gap:6px;margin-bottom:8px}.b{flex:1;padding:9px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700;font-size:13px}.on{border-color:#fc0;background:#fff9db}#w{height:240px;background:#e5e9ec;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}.p{position:absolute;font-size:24px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}#st2{position:absolute;left:6px;bottom:6px;z-index:9;background:#fff;padding:2px 6px;border-radius:5px;font-size:11px}.ir{display:flex;gap:4px;margin-bottom:6px}.inp{flex:1;padding:10px;border:2px solid #ddd;border-radius:9px;font-size:14px}.sbtn{padding:0 12px;border:2px solid #ddd;border-radius:9px;background:#f8f9fa}.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}.canc{width:100%;background:#ff4d4f;color:#fff;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}</style></head>
<body><div class=c><div style="text-align:center;font-weight:800;font-size:16px;margin-bottom:6px">🚕 Такси «Север-Юг»</div>
<div id=st style="text-align:center;font-weight:700;margin-bottom:6px;font-size:13px">Укажите адреса маршрута</div>
<div id=w><div id=ly style="position:absolute;inset:0"></div><div id=pins></div><div style="position:absolute;right:6px;top:6px;z-index:9"><button onclick="zm(1)">+</button><button onclick="zm(-1)">-</button></div><div id=st2>v12</div></div>
<div id=ptsBox><div class=ir><input id=in0 class=inp placeholder="🟢 Откуда (улица, дом)"><button class=sbtn onclick="findAdr(0)">🔍</button></div><div class=ir><input id=in1 class=inp placeholder="🔴 Куда (улица, дом)"><button class=sbtn onclick="findAdr(1)">🔍</button></div></div>
<div class=r><button class=b onclick="addPt()">➕ Добавить точку</button><button class=b onclick="getGps()">📍 Мой GPS</button></div>
<div class=ir><input id=phInp class=inp type=tel placeholder="📱 Ваш телефон"></div>
<div class=r><button class="b on" id=t1 onclick="setT(1)">Эконом <span id=p1>150 ₽</span></button><button class=b id=t2 onclick="setT(2)">Комфорт <span id=p2>225 ₽</span></button></div>
<button class=go id=obtn onclick="sendOrd()">Заказать такси</button></div>
<script>
const U1="https://"+"tile.openstreetmap.org/";
const NOM="https://"+"nominatim.openstreetmap.org/";
const API="https://"+"api.telegram.org/bot8202523047:"+"AAHHpOewNLvmPzz8DyRXWAbEqpdMKQIWafo/sendMessage";
const MAX_API="https://"+"platform-api.max.ru/messages?access_token=f9LHodD0cOK6QaPxAdAjQ6eEFHvlZEdvsaCIXrwpm-7I2wvUfde_65Z0qjrdqvZU9uStkSbp9_TGY_JQlA3_";
const MAX_DRVS="219995701,39765796,31300219,42019045".split(",");
const ADM="1304496435";
const tg=window.Telegram?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}
let cLat=56.8389,cLon=60.6057,z=15,tr=1,pts=[null,null],cur=0,actId=null,curCity="Екатеринбург",carPt=null,pollTmr=null;
const w=document.getElementById('w'),ly=document.getElementById('ly'),pins=document.getElementById('pins'),st=document.getElementById('st');

function l2t(la,lo,zm){const n=1<<zm,r=la*Math.PI/180;return{x:(lo+180)/360*n,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n};}
function t2l(x,y,zm){const n=1<<zm,r=Math.atan(Math.sinh(Math.PI*(1-2*y/n)));return{lat:r*180/Math.PI,lon:x/n*360-180};}
function draw(){
  const W=w.clientWidth||320,H=w.clientHeight||240,c=l2t(cLat,cLon,z),m=1<<z;ly.innerHTML='';
  for(let x=Math.floor(c.x-W/512);x<=Math.floor(c.x+W/512);x++)for(let y=Math.floor(c.y-H/512);y<=Math.floor(c.y+H/512);y++){
    if(y<0||y>=m)continue;const wx=((x%m)+m)%m,im=document.createElement('img');
    im.src=U1+z+'/'+wx+'/'+y+'.png';
    im.style.cssText='position:absolute;left:'+Math.round(W/2+(x-c.x)*256)+'px;top:'+Math.round(H/2+(y-c.y)*256)+'px;width:256px;height:256px;pointer-events:none';
    ly.appendChild(im);
  }
  pins.innerHTML='';
  if(carPt){const cp=l2t(carPt.lat,carPt.lon,z),cd=document.createElement('div');cd.className='p';cd.textContent='🚕';cd.style.left=(W/2+(cp.x-c.x)*256)+'px';cd.style.top=(H/2+(cp.y-c.y)*256)+'px';pins.appendChild(cd);}
  pts.forEach((p,i)=>{if(!p)return;const tp=l2t(p.lat,p.lon,z),d=document.createElement('div');d.className='p';d.textContent=i===0?'🟢':(i===pts.length-1?'🔴':'🟡');d.style.left=(W/2+(tp.x-c.x)*256)+'px';d.style.top=(H/2+(tp.y-c.y)*256)+'px';pins.appendChild(d);});
  document.getElementById('st2').textContent='v16 z'+z;calc();
}
function setT(v){tr=v;document.getElementById('t1').classList.toggle('on',v===1);document.getElementById('t2').classList.toggle('on',v===2);}
function zm(d){z=Math.max(11,Math.min(18,z+d));draw();}
let dg=false,mv=false,sx=0,sy=0;
w.addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON'){dg=true;mv=false;sx=e.clientX;sy=e.clientY;}});
window.addEventListener('pointermove',e=>{if(!dg)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)mv=true;if(!mv)return;sx=e.clientX;sy=e.clientY;const c=l2t(cLat,cLon,z),n=t2l(c.x-dx/256,c.y-dy/256,z);cLat=n.lat;cLon=n.lon;draw();});
window.addEventListener('pointerup',e=>{if(!dg)return;dg=false;if(!mv&&e.target.tagName!=='BUTTON'){const r=w.getBoundingClientRect(),c=l2t(cLat,cLon,z),p=t2l(c.x+(e.clientX-r.left-w.clientWidth/2)/256,c.y+(e.clientY-r.top-w.clientHeight/2)/256,z);setPt(cur,p.lat,p.lon,true);if(cur<pts.length-1)cur++;}});
async function setPt(i,la,lo,rv){pts[i]={lat:la,lon:lo};draw();if(!rv)return;st.textContent='Определяем адрес...';try{const r=await fetch(NOM+'reverse?format=json&lat='+la+'&lon='+lo+'&accept-language=ru'),d=await r.json(),a=d.address||{},rd=a.road||a.pedestrian||a.suburb||'',hs=a.house_number?(', '+a.house_number):'';if(a.city||a.town||a.village)curCity=a.city||a.town||a.village;document.getElementById('in'+i).value=rd?(rd+hs):(la.toFixed(5)+', '+lo.toFixed(5));st.textContent='Точка установлена';}catch{document.getElementById('in'+i).value=la.toFixed(5)+', '+lo.toFixed(5);}}
async function findAdr(i){
  cur=i;const q=document.getElementById('in'+i).value.trim();if(!q)return;
  st.textContent='Ищем...';
  try{
    let r=await fetch(NOM+'search?format=json&limit=1&countrycodes=ru&q='+encodeURIComponent(curCity+', '+q)+'&accept-language=ru');
    let a=await r.json();
    if(!a||!a.length){r=await fetch(NOM+'search?format=json&limit=1&countrycodes=ru&q='+encodeURIComponent(q)+'&accept-language=ru');a=await r.json();}
    const item=a&&a.at(0);
    if(item&&item.lat){cLat=parseFloat(item.lat);cLon=parseFloat(item.lon);pts[i]={lat:cLat,lon:cLon};draw();st.textContent='Найдено';}
    else st.textContent='Не найдено';
  }catch(e){st.textContent='Ошибка: '+e.message;}
}
function addPt(){if(pts.length>=5)return alert('Максимум 5 точек');const i=pts.length;pts.push(null);const d=document.createElement('div');d.className='ir';d.innerHTML='<input id=in'+i+' class=inp placeholder="🟡 Точка '+i+'" onfocus="cur='+i+'"><button class=sbtn onclick="findAdr('+i+')">🔍</button>';document.getElementById('ptsBox').appendChild(d);cur=i;}
function getGps(){if(!navigator.geolocation)return alert('Нет GPS');st.textContent='Ищем GPS...';navigator.geolocation.getCurrentPosition(p=>{cLat=p.coords.latitude;cLon=p.coords.longitude;setPt(0,cLat,cLon,true);},()=>{st.textContent='Ошибка GPS';},{enableHighAccuracy:true,timeout:8000});}
function calc(){let km=0;for(let i=0;i<pts.length-1;i++)if(pts[i]&&pts[i+1]){const R=6371,dLa=(pts[i+1].lat-pts[i].lat)*Math.PI/180,dLo=(pts[i+1].lon-pts[i].lon)*Math.PI/180,s=Math.sin(dLa/2)**2+Math.cos(pts[i].lat*Math.PI/180)*Math.cos(pts[i+1].lat*Math.PI/180)*Math.sin(dLo/2)**2;km+=R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))*1.25;}document.getElementById('p1').textContent=Math.max(150,Math.round((150+Math.max(0,km-2)*25)/5)*5)+' ₽';document.getElementById('p2').textContent=Math.max(225,Math.round((225+Math.max(0,km-2)*35)/5)*5)+' ₽';}

function saveState(obj){
  if(!obj){localStorage.removeItem('ns_ord');return;}
  localStorage.setItem('ns_ord',JSON.stringify(obj));
}
const TG_BASE="https://"+"api.telegram.org/bot8202523047:"+"AAHHpOewNLvmPzz8DyRXWAbEqpdMKQIWafo/";
const SYNC_CH="-1005956653266";
async function sendCh(obj){
  const r=await fetch(TG_BASE+'sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:SYNC_CH,text:JSON.stringify(obj)})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.description||'TG error');
}
function startPoll(id){
  if(pollTmr)clearInterval(pollTmr);
  pollTmr=setInterval(async()=>{
    try{
      const r=await fetch(TG_BASE+'getChat?chat_id='+SYNC_CH+'&t='+Date.now());
      const j=await r.json();
      if(!j.ok||!j.result||!j.result.description)return;
      const cur=JSON.parse(j.result.description);
      const d=cur['taxi_ns_out_'+id];
      if(!d)return;
      if(d.lat&&d.lon){carPt={lat:d.lat,lon:d.lon};draw();}
      if(d.text){st.textContent=d.text;const curS=JSON.parse(localStorage.getItem('ns_ord')||'{}');curS.status=d.text;saveState(curS);}
      if(d.st==='canc'||d.st==='done'){resetOrderUI(d.text||'Заказ завершён');}
    }catch{}
  },2500);
}
function resetOrderUI(msg){
  if(pollTmr){clearInterval(pollTmr);pollTmr=null;}
  actId=null;carPt=null;saveState(null);draw();
  const btn=document.getElementById('obtn');btn.className='go';btn.textContent='Заказать такси';
  if(msg)st.textContent=msg;
}
async function sendOrd(){
  const btn=document.getElementById('obtn');
  if(actId){
    const oldId=actId;
    await sendCh({act:'canc',oid:oldId}).catch(()=>{});
    resetOrderUI('Заказ #'+oldId+' отменён');return;
  }
  const a=[];for(let i=0;i<pts.length;i++){const v=document.getElementById('in'+i).value.trim();if(v)a.push(v);}
  const ph=document.getElementById('phInp').value.trim();
  if(a.length<2)return alert('Укажите адреса Откуда и Куда!');
  if(ph.replace(/\D/g,'').length<10)return alert('Укажите номер телефона!');
  const tc=tr===1?'econom':'comfort';
  const tn=(tr===1?'Эконом':'Комфорт')+' ('+document.getElementById(tr===1?'p1':'p2').textContent+')';
  if(tg&&tg.initData){tg.sendData(JSON.stringify({fr:a.at(0),to:a.slice(1).join(' -> '),tar:tc,pr:document.getElementById(tr===1?'p1':'p2').textContent,ph:ph}));return;}
  actId=(Date.now()%9000+1000);
  const fr=a.at(0),to=a.slice(1).join(' -> ');
  const stTxt='Заказ #'+actId+' отправлен водителям! Ищем машину...';
  btn.disabled=true;btn.textContent='⏳ Отправка...';
  try{
    await sendCh({act:'new',oid:actId,fr:fr,to:to,tn:tn,tc:tc,ph:ph});
    saveState({id:actId,fr:fr,to:to,ph:ph,status:stTxt});
    startPoll(actId);
    btn.className='canc';btn.textContent='❌ Отменить заказ #'+actId;st.textContent=stTxt;
  }catch(e){
    actId=null;alert('Ошибка отправки: '+e.message);btn.className='go';btn.textContent='Заказать такси';
  }finally{btn.disabled=false;}
}
(function restore(){
  try{
    const saved=JSON.parse(localStorage.getItem('ns_ord')||'null');
    if(saved&&saved.id){
      actId=saved.id;
      if(saved.fr)document.getElementById('in0').value=saved.fr;
      if(saved.to)document.getElementById('in1').value=saved.to;
      if(saved.ph)document.getElementById('phInp').value=saved.ph;
      const btn=document.getElementById('obtn');btn.className='canc';btn.textContent='❌ Отменить заказ #'+actId;
      st.textContent=saved.status||('Активен заказ #'+actId);
      startPoll(actId);
    }
  }catch{}
})();
window.addEventListener('resize',draw);draw();
</script></body></html>
