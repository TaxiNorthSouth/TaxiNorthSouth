<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Такси Полевской</title>
<style>
body{font-family:sans-serif;margin:0;padding:10px;background:#f0f2f5;user-select:none}
.card{background:#fff;padding:12px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:460px;margin:0 auto}
.tabs{display:flex;gap:4px;margin-bottom:10px;background:#eee;padding:4px;border-radius:10px}
.tab{flex:1;padding:8px 4px;border:none;border-radius:8px;background:0 0;font-size:12px;font-weight:700;color:#555}
.tab.active{background:#fff;color:#000;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#wrap{height:310px;background:#e5e9ec;border-radius:12px;margin-bottom:10px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}
.box{width:100%;height:100%;position:absolute;top:0;left:0;display:none}
.box.show{display:block}
#ymap-msg{padding:16px;text-align:center;font-size:13px;color:#333;margin-top:85px}
.row{display:flex;gap:8px;margin-bottom:8px}
.btn{flex:1;padding:11px 6px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:13px;font-weight:700}
.btn.active{border-color:#fc0;background:#fff9db}
.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:12px}
.pin{position:absolute;font-size:28px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}
#scar,#tcar{transition:left .15s linear,top .15s linear;display:none;z-index:6;font-size:28px;transform:translate(-50%,-50%)}
.zbtns{position:absolute;right:8px;top:8px;z-index:10;display:flex;flex-direction:column;gap:4px}
.zbtn{width:34px;height:34px;border-radius:8px;border:1px solid #bbb;background:#fff;font-size:20px;font-weight:700}
#tile-stat{position:absolute;left:8px;bottom:6px;z-index:10;background:rgba(255,255,255,.85);padding:2px 6px;border-radius:6px;font-size:11px;color:#333}
</style>
</head>
<body>
<div class="card">
<div class="tabs">
<button class="tab active" id="t-2gis" onclick="sw('2gis')">2ГИС</button>
<button class="tab" id="t-arcgis" onclick="sw('arcgis')">ArcGIS</button>
<button class="tab" id="t-yandex" onclick="sw('yandex')">Яндекс</button>
<button class="tab" id="t-svg" onclick="sw('svg')">Схема</button>
</div>
<div id="st" style="margin-bottom:8px;font-weight:700;text-align:center;font-size:14px">Нажмите на карту для Точки А</div>
<div id="wrap">
<div id="b-tiles" class="box show">
  <div id="tiles-layer" style="position:absolute;inset:0"></div>
  <svg id="route-svg" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4">
    <line id="rline" x1="0" y1="0" x2="0" y2="0" stroke="#222" stroke-width="4" stroke-dasharray="6,4"/>
  </svg>
  <div id="mA" class="pin">🟢</div>
  <div id="mB" class="pin">🔴</div>
  <div id="tcar" class="pin">🚕</div>
  <div class="zbtns"><button class="zbtn" onclick="zoom(1)">+</button><button class="zbtn" onclick="zoom(-1)">−</button></div>
  <div id="tile-stat">Загрузка тайлов...</div>
</div>
<div id="b-yandex" class="box"><div id="ymap-msg">Загрузка Яндекс.Карт...</div></div>
<div id="b-svg" class="box" onclick="tapSvg(event)">
<svg viewBox="0 0 400 300" preserveAspectRatio="none" style="width:100%;height:100%;display:block;pointer-events:none">
<rect width="400" height="300" fill="#f3f4ef"/>
<path d="M0,125 Q65,115 95,150 T60,210 L0,200 Z" fill="#aadaff"/>
<line x1="195" y1="0" x2="195" y2="300" stroke="#f7d36f" stroke-width="11"/>
<line x1="0" y1="95" x2="400" y2="95" stroke="#f7d36f" stroke-width="10"/>
<line x1="95" y1="170" x2="400" y2="170" stroke="#f7d36f" stroke-width="10"/>
<text x="198" y="75" font-size="9" fill="#555" transform="rotate(90 198,75)">ул. Коммунистическая</text>
<text x="130" y="98" font-size="9" fill="#555">ул. Ленина</text>
<text x="215" y="173" font-size="9" fill="#555">ул. Карла Маркса</text>
</svg>
<div id="sA" class="pin" style="left:32%;top:68%">🟢</div>
<div id="sB" class="pin" style="left:72%;top:31%">🔴</div>
<div id="scar" class="pin">🚕</div>
</div>
</div>
<div class="row">
<button id="bA" class="btn active" onclick="setM('A')">🟢 Точка А</button>
<button id="bB" class="btn" onclick="setM('B')">🔴 Точка Б</button>
</div>
<div class="row">
<button id="t1" class="btn active" onclick="setT('t1')">Эконом<br><span id="p1">150 ₽</span></button>
<button id="t2" class="btn" onclick="setT('t2')">Комфорт<br><span id="p2">225 ₽</span></button>
</div>
<button id="obtn" class="go" onclick="go()">Заказать такси</button>
</div>
<script>
var KEY='2738e3ad-b2a6-4dec-b0c6-0bcf3323d2ad',m='A',tmr=null,prov='2gis';
var cLat=56.4475,cLng=60.1895,z=14;
var latA=56.4426,lngA=60.1819,latB=56.4530,lngB=60.1980,sA={x:32,y:68},sB={x:72,y:31};
var yMap=null,yMkA,yMkB,yLn,yCar,yLoad=false;

function ll2px(lat,lng,zm){
  var n=Math.pow(2,zm),x=(lng+180)/360*n*256;
  var r=lat*Math.PI/180,y=(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256;
  return {x:x,y:y};
}
function px2ll(x,y,zm){
  var n=Math.pow(2,zm),lng=x/(n*256)*360-180;
  var a=Math.PI-2*Math.PI*y/(n*256),lat=180/Math.PI*Math.atan(0.5*(Math.exp(a)-Math.exp(-a)));
  return {lat:lat,lng:lng};
}

function drawTiles(){
  var box=document.getElementById('b-tiles'),lay=document.getElementById('tiles-layer');
  var w=box.clientWidth||360,h=box.clientHeight||310;
  var cp=ll2px(cLat,cLng,z),x0=cp.x-w/2,y0=cp.y-h/2;
  var tx0=Math.floor(x0/256),ty0=Math.floor(y0/256);
  var tx1=Math.floor((x0+w)/256),ty1=Math.floor((y0+h)/256);
  var maxT=Math.pow(2,z),ok=0,err=0;
  lay.innerHTML='';
  for(var tx=tx0;tx<=tx1;tx++){
    for(var ty=ty0;ty<=ty1;ty++){
      if(ty<0||ty>=maxT)continue;
      var wx=((tx%maxT)+maxT)%maxT;
      var img=document.createElement('img');
      img.referrerPolicy='no-referrer';
      img.style.cssText='position:absolute;width:256px;height:256px;left:'+(tx*256-x0)+'px;top:'+(ty*256-y0)+'px;pointer-events:none';
      img.onload=function(){ok++;document.getElementById('tile-stat').innerText=prov.toUpperCase()+': загружено ('+ok+')';};
      img.onerror=function(){err++;document.getElementById('tile-stat').innerText=prov.toUpperCase()+': ошибка сети ('+err+')';};
      var s=(wx+ty)%4;
      img.src=(prov==='2gis')
        ?'https://tile'+s+'://'
        :'https://arcgisonline.com;
      lay.appendChild(img);
    }
  }
  placePins();
}

function placePins(){
  var box=document.getElementById('b-tiles'),w=box.clientWidth||360,h=box.clientHeight||310;
  var cp=ll2px(cLat,cLng,z),x0=cp.x-w/2,y0=cp.y-h/2;
  var pA=ll2px(latA,lngA,z),pB=ll2px(latB,lngB,z);
  var ax=pA.x-x0,ay=pA.y-y0,bx=pB.x-x0,by=pB.y-y0;
  document.getElementById('mA').style.left=ax+'px';document.getElementById('mA').style.top=ay+'px';
  document.getElementById('mB').style.left=bx+'px';document.getElementById('mB').style.top=by+'px';
  var ln=document.getElementById('rline');
  ln.setAttribute('x1',ax);ln.setAttribute('y1',ay);ln.setAttribute('x2',bx);ln.setAttribute('y2',by);
}

function zoom(d){z=Math.max(11,Math.min(18,z+d));drawTiles();}

(function(){
  var el=document.getElementById('b-tiles'),sx=0,sy=0,moved=false,slat=0,slng=0;
  el.addEventListener('pointerdown',function(e){
    if(e.target.className==='zbtn')return;
    sx=e.clientX;sy=e.clientY;moved=false;slat=cLat;slng=cLng;
  });
  el.addEventListener('pointermove',function(e){
    if(!sx)return;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>6||Math.abs(dy)>6)moved=true;
    if(moved){var cp=ll2px(slat,slng,z),np=px2ll(cp.x-dx,cp.y-dy,z);cLat=np.lat;cLng=np.lng;drawTiles();}
  });
  el.addEventListener('pointerup',function(e){
    if(!sx)return;
    if(!moved&&e.target.className!=='zbtn'){
      var r=el.getBoundingClientRect(),cp=ll2px(cLat,cLng,z);
      var ll=px2ll(cp.x-r.width/2+(e.clientX-r.left),cp.y-r.height/2+(e.clientY-r.top),z);
      upd(ll.lat,ll.lng);
    }
    sx=0;
  });
})();

function sw(e){
  var ids=['2gis','arcgis','yandex','svg'];
  for(var i=0;i<4;i++)document.getElementById('t-'+ids[i]).className=(ids[i]===e)?'tab active':'tab';
  document.getElementById('b-tiles').className=(e==='2gis'||e==='arcgis')?'box show':'box';
  document.getElementById('b-yandex').className=(e==='yandex')?'box show':'box';
  document.getElementById('b-svg').className=(e==='svg')?'box show':'box';
  if(e==='2gis'||e==='arcgis'){prov=e;drawTiles();}
  if(e==='yandex')initY();
}

function initY(){
  if(yMap){yMap.container.fitToViewport();return;}
  if(yLoad)return;yLoad=true;
  var s=document.createElement('script');
  s.src='https://yandex.ru';
  s.onerror=function(){document.getElementById('ymap-msg').innerHTML='Яндекс заблокирован сетью/VPN.<br>Используйте <b>2ГИС</b> или <b>ArcGIS</b>';};
  s.onload=function(){
    ymaps.ready(function(){
      document.getElementById('b-yandex').innerHTML='';
      yMap=new ymaps.Map('b-yandex',{center:[latA,lngA],zoom:14,controls:['zoomControl']});
      yMkA=new ymaps.Placemark([latA,lngA],{},{preset:'islands#greenDotIcon'});
      yMkB=new ymaps.Placemark([latB,lngB],{},{preset:'islands#redDotIcon'});
      yLn=new ymaps.Polyline([[latA,lngA],[latB,lngB]],{},{strokeColor:'#222',strokeWidth:4});
      yMap.geoObjects.add(yMkA);yMap.geoObjects.add(yMkB);yMap.geoObjects.add(yLn);
      yMap.events.add('click',function(e){var c=e.get('coords');upd(c[0],c[1]);});
    },function(){document.getElementById('ymap-msg').innerHTML='Ключ Яндекса отклонён.';});
  };
  document.head.appendChild(s);
}

function upd(lat,lng){
  if(m==='A'){latA=lat;lngA=lng;setM('B');}else{latB=lat;lngB=lng;}
  placePins();
  if(yMap){yMkA.geometry.setCoordinates([latA,lngA]);yMkB.geometry.setCoordinates([latB,lngB]);yLn.geometry.setCoordinates([[latA,lngA],[latB,lngB]]);}
  var km=Math.sqrt(Math.pow((latB-latA)*111,2)+Math.pow((lngB-lngA)*61,2))*1.3;
  var pr=Math.max(100,Math.round(80+km*28));
  document.getElementById('p1').innerText=pr+' ₽';document.getElementById('p2').innerText=Math.round(pr*1.5)+' ₽';
}

function tapSvg(e){
  var r=document.getElementById('b-svg').getBoundingClientRect(),x=Math.round(((e.clientX-r.left)/r.width)*100),y=Math.round(((e.clientY-r.top)/r.height)*100);
  if(m==='A'){sA={x:x,y:y};document.getElementById('sA').style.left=x+'%';document.getElementById('sA').style.top=y+'%';setM('B');}
  else{sB={x:x,y:y};document.getElementById('sB').style.left=x+'%';document.getElementById('sB').style.top=y+'%';}
  var pr=Math.max(100,Math.round(80+Math.sqrt(Math.pow(sB.x-sA.x,2)+Math.pow(sB.y-sA.y,2))*2));
  document.getElementById('p1').innerText=pr+' ₽';document.getElementById('p2').innerText=Math.round(pr*1.5)+' ₽';
}

function setM(v){m=v;document.getElementById('bA').className=v==='A'?'btn active':'btn';document.getElementById('bB').className=v==='B'?'btn active':'btn';document.getElementById('st').innerText=v==='A'?'Нажмите на карту для Точки А':'Нажмите на карту для Точки Б';}
function setT(id){document.getElementById('t1').className=id==='t1'?'btn active':'btn';document.getElementById('t2').className=id==='t2'?'btn active':'btn';}

function go(){
  var b=document.getElementById('obtn');
  if(b.innerText==='Отменить заказ'){
    clearInterval(tmr);
    if(yCar&&yMap)yMap.geoObjects.remove(yCar);
    document.getElementById('tcar').style.display='none';document.getElementById('scar').style.display='none';
    b.innerText='Заказать такси';setM('A');return;
  }
  b.innerText='Ищем машину...';
  setTimeout(function(){
    b.innerText='Отменить заказ';document.getElementById('st').innerText='Машина выехала к точке А!';
    var sx=latA+0.006,sy=lngA+0.006,s=0;
    if(yMap){yCar=new ymaps.Placemark([sx,sy],{},{preset:'islands#yellowAutoIcon'});yMap.geoObjects.add(yCar);}
    var tc=document.getElementById('tcar');tc.style.display='block';
    var sc=document.getElementById('scar'),fx=sA.x>50?sA.x-25:sA.x+25,fy=sA.y>50?sA.y-25:sA.y+25;
    sc.style.left=fx+'%';sc.style.top=fy+'%';sc.style.display='block';
    tmr=setInterval(function(){
      s++;var cx=sx+(latA-sx)*(s/25),cy=sy+(lngA-sy)*(s/25);
      if(yCar)yCar.geometry.setCoordinates([cx,cy]);
      var box=document.getElementById('b-tiles'),cp=ll2px(cLat,cLng,z),tp=ll2px(cx,cy,z);
      tc.style.left=(tp.x-(cp.x-(box.clientWidth||360)/2))+'px';
      tc.style.top=(tp.y-(cp.y-(box.clientHeight||310)/2))+'px';
      sc.style.left=(fx+(sA.x-fx)*(s/25))+'%';sc.style.top=(fy+(sA.y-fy)*(s/25))+'%';
      if(s>=25){clearInterval(tmr);document.getElementById('st').innerText='Водитель на месте! Выходите';}
    },150);
  },1200);
}
drawTiles();
</script>
</body>
</html>
