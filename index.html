<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Такси Полевской</title>
<link rel="stylesheet" href="https://cloudflare.com"/>
<script src="https://cloudflare.com"></script>
<style>
body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}
.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}
.r{display:flex;gap:6px;margin-bottom:8px}
.b{flex:1;padding:10px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700}
.on{border-color:#fc0;background:#fff9db}
#map{height:320px;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;z-index:1;background:#e5e9ec}
.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}
</style>
</head>
<body>
<div class="c">
<div class="r">
<button class="b on" id="p1" onclick="setProv('osm')">OSM</button>
<button class="b" id="p2" onclick="setProv('arcgis')">ArcGIS</button>
<button class="b" id="p3" onclick="setProv('2gis')">2ГИС</button>
</div>
<div id="st" style="text-align:center;font-weight:700;margin-bottom:6px">Точка А: нажмите на карту</div>
<div id="map"></div>
<div class="r">
<button class="b on" id="mA" onclick="setMode('A')">🟢 Точка А</button>
<button class="b" id="mB" onclick="setMode('B')">🔴 Точка Б</button>
</div>
<div class="r">
<button class="b on" id="t1" onclick="setTar(1)">Эконом <span id="pr1">150 ₽</span></button>
<button class="b" id="t2" onclick="setTar(2)">Комфорт <span id="pr2">225 ₽</span></button>
</div>
<button class="go" onclick="sendOrder()">Заказать такси</button>
</div>
<script>
var mode='A', latA=56.4426, lngA=60.1819, latB=56.4530, lngB=60.1980;
var map=L.map('map').setView([56.4475, 60.1895], 14);
var urls={
  'osm':'https://openstreetmap.org{z}/{x}/{y}.png',
  'arcgis':'https://arcgisonline.com{z}/{y}/{x}',
  '2gis':'https://tile{s}://{x}&y={y}&z={z}&v=1'
};
var layer=L.tileLayer(urls['osm'],{subdomains:'0123',maxZoom:18}).addTo(map);
var mkA=L.marker([latA,lngA]).addTo(map).bindPopup('Точка А');
var mkB=L.marker([latB,lngB]).addTo(map).bindPopup('Точка Б');
var line=L.polyline([[latA,lngA],[latB,lngB]],{color:'#222',weight:4}).addTo(map);

function setProv(p){
  document.getElementById('p1').className=(p==='osm')?'b on':'b';
  document.getElementById('p2').className=(p==='arcgis')?'b on':'b';
  document.getElementById('p3').className=(p==='2gis')?'b on':'b';
  map.removeLayer(layer);
  layer=L.tileLayer(urls[p],{subdomains:'0123',maxZoom:18}).addTo(map);
}
function setMode(m){
  mode=m;
  document.getElementById('mA').className=(m==='A')?'b on':'b';
  document.getElementById('mB').className=(m==='B')?'b on':'b';
  document.getElementById('st').innerText=(m==='A')?'Точка А: нажмите на карту':'Точка Б: нажмите на карту';
}
function setTar(t){
  document.getElementById('t1').className=(t===1)?'b on':'b';
  document.getElementById('t2').className=(t===2)?'b on':'b';
}
map.on('click',function(e){
  if(mode==='A'){latA=e.latlng.lat;lngA=e.latlng.lng;mkA.setLatLng([latA,lngA]);setMode('B');}
  else{latB=e.latlng.lat;lngB=e.latlng.lng;mkB.setLatLng([latB,lngB]);}
  line.setLatLngs([[latA,lngA],[latB,lngB]]);
  var km=map.distance([latA,lngA],[latB,lngB])/1000*1.3;
  var p=Math.max(100,Math.round(80+km*28));
  document.getElementById('pr1').innerText=p+' ₽';
  document.getElementById('pr2').innerText=Math.round(p*1.5)+' ₽';
});
function sendOrder(){
  document.getElementById('st').innerText='Заказ оформлен: '+document.getElementById('pr1').innerText;
}
</script>
</body>
</html>
