<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content=width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no><meta name=referrer content=no-referrer>
<title>Такси Север-Юг</title>
<script src="https://telegram.org"></script>
<style>body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}.r{display:flex;gap:6px;margin-bottom:8px}.b{flex:1;padding:9px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700;font-size:13px}.on{border-color:#fc0;background:#fff9db}#w{height:240px;background:#e5e9ec;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}.p{position:absolute;font-size:24px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}#st2{position:absolute;left:6px;bottom:6px;z-index:9;background:#fff;padding:2px 6px;border-radius:5px;font-size:11px}.ir{display:flex;gap:4px;margin-bottom:6px}.inp{flex:1;padding:8px 10px;border:2px solid #ddd;border-radius:9px;font-size:13px;outline:none}.inp.act{border-color:#fc0;background:#fffdf2}.sbtn{padding:0 10px;border:2px solid #ddd;border-radius:9px;background:#f8f9fa;font-size:14px}.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}.canc{width:100%;background:#ff4d4f;color:#fff;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}</style></head>
<body><div class=c>
<div style="text-align:center;font-weight:800;font-size:16px;margin-bottom:6px">🚕 Такси «Север-Юг»</div>
<div class=r><button class='b on' id=b1 onclick='setP(1)'>OSM (Дома)</button><button class=b id=b2 onclick='setP(2)'>ArcGIS</button></div>
<div id=st style=text-align:center;font-weight:700;margin-bottom:6px;font-size:13px>Выберите точки маршрута</div>
<div id=w><div id=ly style=position:absolute;inset:0></div><div id=pins></div><div style=position:absolute;right:6px;top:6px;z-index:9><button onclick='zm(1)'>+</button><button onclick='zm(-1)'>-</button></div><div id=st2>Старт</div></div>
<div id=ptsBox></div>
<div class=r><button class=b onclick='addPt()'>➕ Добавить точку</button><button class=b onclick='getGps()'>📍 Мой GPS</button></div>
<div class=ir id=phRow><input id=phInp class=inp type=tel placeholder='📱 Ваш телефон (для заказа с сайта)'></div>
<div class=r><button class='b on' id=t1 onclick='setT(1)'>Эконом <span id=p1>150 ₽</span></button><button class=b id=t2 onclick='setT(2)'>Комфорт <span id=p2>225 ₽</span></button></div>
<button class=go id=obtn onclick='sendOrd()'>Заказать такси</button></div>
<script>
var pr=1,z=15,city='Полевской',cLa=56.4475,cLn=60.1895,cur=0,webOid=0,H='https:'+String.fromCharCode(47,47),AMP=String.fromCharCode(38);
var pts=[{la:56.4426,ln:60.1819,adr:''},{la:56.4530,ln:60.1980,adr:''}];
var isTg=!!(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData);
if(isTg){Telegram.WebApp.ready();Telegram.WebApp.expand();phRow.style.display='none';}
function u(p,x,y,z){
  if(p==1)return H+'tile.openstreetmap'+'.org/'+z+'/'+x+'/'+y+'.png';
  return H+'server.arcgisonline'+'.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/'+z+'/'+y+'/'+x;
}
function px(la,ln){var n=1<<z,r=la*Math.PI/180;return{x:(ln+180)/360*n*256,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256};}
function ll(x,y){var n=1<<z,a=Math.PI-2*Math.PI*y/(n*256);return{la:180/Math.PI*Math.atan(.5*(Math.exp(a)-Math.exp(-a))),ln:x/(n*256)*360-180};}
function zm(d){var mx=(pr==2?15:18);z=Math.max(11,Math.min(mx,z+d));draw();}
function setP(v){pr=v;b1.classList.toggle('on',v==1);b2.classList.toggle('on',v==2);if(v==2){if(z>15)z=15;}draw();}
function setT(v){t1.classList.toggle('on',v==1);t2.classList.toggle('on',v==2);}
function addPt(){pts.push({la:cLa,ln:cLn,adr:''});cur=pts.length-1;renderInputs();draw();}
function delPt(i){if(pts.length<=2)return;pts.splice(i,1);if(cur>=pts.length)cur=pts.length-1;renderInputs();draw();calc();}
function renderInputs(){
  var h='';
  for(var i=0;i<pts.length;i++){
    var ic=(i==0?'🟢':(i==pts.length-1?'🔴':'🟡'));
    var ph=(i==0?'Откуда':(i==pts.length-1?'Куда':'Заезд '+(i+1)));
    var act=(i==cur?' act':'');
    var del=(pts.length>2?'<button class=sbtn onclick="delPt('+i+')">✕</button>':'');
    h+='<div class=ir><input id=in'+i+' class="inp'+act+'" value="'+pts[i].adr.replace(/"/g,'')+'" placeholder="'+ic+' '+ph+'" onfocus="cur='+i+';renderInputs()" oninput="pts['+i+'].adr=this.value" onkeydown="if(event.keyCode==13)findAdr('+i+')"><button class=sbtn onclick="findAdr('+i+')">🔍</button>'+del+'</div>';
  }
  ptsBox.innerHTML=h;
}
function calc(){
  var km=0;
  for(var i=0;i<pts.length-1;i++){
    km+=Math.hypot((pts[i+1].la-pts[i].la)*111,(pts[i+1].ln-pts[i].ln)*61)*1.3;
  }
  if(!isFinite(km))return;
  var v=Math.max(100,Math.round(80+km*28+(pts.length-2)*40));
  p1.textContent=v+' ₽';p2.textContent=Math.round(v*1.5)+' ₽';
}
function geo(la,ln,i){
  pts[i].adr='Поиск адреса...';renderInputs();
  fetch(H+'nominatim.openstreetmap'+'.org/reverse?format=json'+AMP+'lat='+la+AMP+'lon='+ln)
  .then(function(r){return r.json();})
  .then(function(d){
    var a=d.address||{};
    if(a.city||a.town)city=a.city||a.town;
    pts[i].adr=(a.road||'Точка')+(a.house_number?', '+a.house_number:'');
    renderInputs();
  }).catch(function(){pts[i].adr=la.toFixed(5)+', '+ln.toFixed(5);renderInputs();});
}
function findAdr(i){
  var el=document.getElementById('in'+i),q=(el?el.value:pts[i].adr).trim();
  if(!q)return;
  pts[i].adr=q;st.textContent='Ищем: '+q+'...';
  var la0=pts[0].la,ln0=pts[0].ln,vb=(ln0-0.15)+','+(la0+0.15)+','+(ln0+0.15)+','+(la0-0.15);
  fetch(H+'nominatim.openstreetmap'+'.org/search?format=json'+AMP+'limit=1'+AMP+'bounded=1'+AMP+'viewbox='+vb+AMP+'q='+encodeURIComponent(city+', '+q))
  .then(function(r){return r.json();})
  .then(function(d){
    if(!d.length)return fetch(H+'nominatim.openstreetmap'+'.org/search?format=json'+AMP+'limit=1'+AMP+'q='+encodeURIComponent('Свердловская область, '+q)).then(function(r){return r.json();});
    return d;
  })
  .then(function(d){
    var it=d.shift();
    if(!it){st.textContent='Адрес не найден';return;}
    var la=parseFloat(it.lat),ln=parseFloat(it.lon);
    if(!isFinite(la)||!isFinite(ln))return;
    pts[i].la=la;pts[i].ln=ln;cLa=la;cLn=ln;z=(pr==2?15:16);
    if(i<pts.length-1)cur=i+1;
    renderInputs();draw();calc();st.textContent='Адрес найден!';
  }).catch(function(){st.textContent='Ошибка поиска';});
}
function upd(la,ln){
  pts[cur].la=la;pts[cur].ln=ln;geo(la,ln,cur);
  if(cur<pts.length-1)cur++;
  renderInputs();draw();calc();
}
function getGps(){
  if(!navigator.geolocation){st.textContent='GPS недоступен';return;}
  st.textContent='Ищем вас по GPS...';
  navigator.geolocation.getCurrentPosition(function(pos){
    var la=pos.coords.latitude,ln=pos.coords.longitude;
    cLa=la;cLn=ln;cur=0;upd(la,ln);st.textContent='Вы найдены! Укажите куда едем';
  },function(){st.textContent='Включите геолокацию';},{enableHighAccuracy:true,timeout:7000});
}
function tgSend(txt){
  var im=new Image();
  im.src=H+'api.telegram'+'.org/bot8202523047:AAHHpOewNLvmPzz8DyRXWAbEqpdMKQIWafo/sendMessage?chat_id=1304496435'+AMP+'text='+encodeURIComponent(txt);
}
function sendOrd(){
  if(webOid>0){
    tgSend('#WEB_CANCEL '+webOid);
    webOid=0;obtn.className='go';obtn.textContent='Заказать такси';
    st.textContent='🚫 Заказ отменён';return;
  }
  var adrs=[];
  for(var i=0;i<pts.length;i++){
    var v=pts[i].adr.trim();
    if(!v){st.textContent='Заполните адрес точки '+(i+1)+'!';return;}
    adrs.push(v);
  }
  var tar=t1.classList.contains('on')?'Эконом':'Комфорт';
  var prc=t1.classList.contains('on')?p1.textContent:p2.textContent;
  var routeStr=adrs.join(' ➡️ ');
  if(isTg){
    Telegram.WebApp.sendData(JSON.stringify({fr:adrs[0],to:adrs.slice(1).join(' ➡️ '),tar:t1.classList.contains('on')?'econom':'comfort',pr:prc}));
    return;
  }
  var ph=phInp.value.trim();
  if(!ph){st.textContent='Укажите ваш номер телефона!';phInp.focus();return;}
  webOid=Math.floor(1000+Math.random()*9000);
  tgSend('#WEB_ORDER '+webOid+'|'+tar+' '+prc+'|'+ph+'|'+routeStr);
  st.textContent='✅ Заказ #'+webOid+' отправлен! Ищем машину...';
  obtn.className='canc';obtn.textContent='❌ Отменить заказ #'+webOid;
}
function draw(){
  var W=w.clientWidth||340,Ht=w.clientHeight||240,c=px(cLa,cLn),x0=c.x-W/2,y0=c.y-Ht/2,mx=1<<z,ok=0,er=0;
  ly.innerHTML='';
  for(var tx=Math.floor(x0/256);tx<=Math.floor((x0+W)/256);tx++){
    for(var ty=Math.floor(y0/256);ty<=Math.floor((y0+Ht)/256);ty++){
      if(ty>=0){if(mx>ty){
        var wx=((tx%mx)+mx)%mx,im=new Image();
        im.style.cssText='position:absolute;width:256px;height:256px;pointer-events:none;left:'+(tx*256-x0)+'px;top:'+(ty*256-y0)+'px';
        im.onload=function(){ok++;st2.textContent='OK: '+ok;};
        im.onerror=function(){er++;st2.textContent='ERR: '+er;};
        im.src=u(pr,wx,ty,z);ly.appendChild(im);
      }}
    }
  }
  var ph='';
  for(var i=0;i<pts.length;i++){
    var p=px(pts[i].la,pts[i].ln),ic=(i==0?'🟢':(i==pts.length-1?'🔴':'🟡'));
    ph+='<div class=p style="left:'+(p.x-x0)+'px;top:'+(p.y-y0)+'px">'+ic+'</div>';
  }
  pins.innerHTML=ph;
}
var sx=0,sy=0,mv=0,sla=0,sln=0;
w.onpointerdown=function(e){sx=e.clientX;sy=e.clientY;mv=0;sla=cLa;sln=cLn;};
w.onpointermove=function(e){if(sx){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>6)mv=1;if(Math.abs(dy)>6)mv=1;if(mv){var c=px(sla,sln),p=ll(c.x-dx,c.y-dy);cLa=p.la;cLn=p.ln;draw();}}};
w.onpointerup=function(e){if(sx){if(mv==0){var r=w.getBoundingClientRect(),c=px(cLa,cLn),p=ll(c.x-r.width/2+e.clientX-r.left,c.y-r.height/2+e.clientY-r.top);upd(p.la,p.ln);}sx=0;}};
renderInputs();draw();getGps();
</script></body></html>
