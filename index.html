<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="no-referrer"><title>Такси Север-Юг</title>
<script src="https://telegram.org"></script>
<style>body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}.r{display:flex;gap:6px;margin-bottom:8px}.b{flex:1;padding:9px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700;font-size:13px}.on{border-color:#fc0;background:#fff9db}#w{height:240px;background:#e5e9ec;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}.p{position:absolute;font-size:24px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}#st2{position:absolute;left:6px;bottom:6px;z-index:9;background:#fff;padding:2px 6px;border-radius:5px;font-size:11px}.zbtn{width:30px;height:30px;border:1px solid #bbb;background:#fff;border-radius:6px;font-weight:700;font-size:16px;margin-left:4px}.ir{display:flex;gap:4px;margin-bottom:6px}.inp{flex:1;padding:10px;border:2px solid #ddd;border-radius:9px;font-size:14px;min-width:0}.sbtn{padding:0 12px;border:2px solid #ddd;border-radius:9px;background:#f8f9fa}.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}</style></head>
<body><div class="c"><div style="text-align:center;font-weight:800;font-size:16px;margin-bottom:6px">🚕 Такси «Север-Юг»</div>
<div class="r"><button class="b on" id="b1" onclick="setP(1)">Схема (Дома)</button><button class="b" id="b2" onclick="setP(2)">Спутник</button></div>
<div id="st" style="text-align:center;font-weight:700;margin-bottom:6px;font-size:13px">Укажите адреса маршрута</div>
<div id="w"><div id="ly" style="position:absolute;inset:0"></div><div id="pins"></div><div style="position:absolute;right:6px;top:6px;z-index:9"><button class="zbtn" onclick="zm(1)">+</button><button class="zbtn" onclick="zm(-1)">-</button></div><div id="st2">v6</div></div>
<div id="ptsBox"><div class="ir"><input id="in0" class="inp" placeholder="🟢 Откуда (улица, дом)" onfocus="activeIdx=0"><button class="sbtn" onclick="findAdr(0)">🔍</button></div><div class="ir"><input id="in1" class="inp" placeholder="🔴 Куда (улица, дом)" onfocus="activeIdx=1"><button class="sbtn" onclick="findAdr(1)">🔍</button></div></div>
<div class="r"><button class="b" onclick="addPt()">➕ Добавить точку</button><button class="b" onclick="getGps()">📍 Мой GPS</button></div>
<div class="ir"><input id="phInp" class="inp" type="tel" placeholder="📱 Ваш телефон"></div>
<div class="r"><button class="b on" id="t1" onclick="setT(1)">Эконом <span id="p1">150 ₽</span></button><button class="b" id="t2" onclick="setT(2)">Комфорт <span id="p2">225 ₽</span></button></div>
<button class="go" id="obtn" onclick="sendOrd()">Заказать такси</button></div>
<script>
const U1="https://://cartocdn.com/rastertiles/voyager/",U2="https://://arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/",U3="https://://arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/",NOM="https://nominatim.openstreetmap.org/";
const tg=window.Telegram?window.Telegram.WebApp:null;if(tg){tg.ready();tg.expand();}
let cLat=56.4455,cLon=60.1872,zoom=15,prov=1,tar=1,pts=[null,null],activeIdx=0;
const wEl=document.getElementById('w'),lyEl=document.getElementById('ly'),pinsEl=document.getElementById('pins'),stEl=document.getElementById('st');
function l2t(la,lo,z){const n=1<<z,r=la*Math.PI/180;return{x:(lo+180)/360*n,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n};}
function t2l(x,y,z){const n=1<<z,r=Math.atan(Math.sinh(Math.PI*(1-2*y/n)));return{lat:r*180/Math.PI,lon:x/n*360-180};}
function render(){
  const W=wEl.clientWidth||320,H=wEl.clientHeight||240,c=l2t(cLat,cLon,zoom),ts=256,m=1<<zoom;lyEl.innerHTML='';
  for(let x=Math.floor(c.x-W/512);x<=Math.floor(c.x+W/512);x++)for(let y=Math.floor(c.y-H/512);y<=Math.floor(c.y+H/512);y++){
    if(y<0||y>=m)continue;const wx=((x%m)+m)%m,img=document.createElement('img');img.referrerPolicy='no-referrer';
    const primary=prov===1?(U1+zoom+'/'+wx+'/'+y+'.png'):(U2+zoom+'/'+y+'/'+wx);
    const fallback=U3+zoom+'/'+y+'/'+wx;
    img.src=primary;img.onerror=()=>{if(img.src!==fallback)img.src=fallback;};
    img.style.cssText=`position:absolute;left:${Math.round(W/2+(x-c.x)*ts)}px;top:${Math.round(H/2+(y-c.y)*ts)}px;width:256px;height:256px;pointer-events:none`;
    lyEl.appendChild(img);
  }
  pinsEl.innerHTML='';pts.forEach((p,i)=>{if(!p)return;const tp=l2t(p.lat,p.lon,zoom),d=document.createElement('div');d.className='p';d.textContent=i===0?'🟢':(i===pts.length-1?'🔴':'🟡');d.style.left=`${W/2+(tp.x-c.x)*ts}px`;d.style.top=`${H/2+(tp.y-c.y)*ts}px`;pinsEl.appendChild(d);});
  document.getElementById('st2').textContent='z'+zoom;calcPrice();
}
function setP(p){prov=p;document.getElementById('b1').classList.toggle('on',p===1);document.getElementById('b2').classList.toggle('on',p===2);render();}
function setT(t){tar=t;document.getElementById('t1').classList.toggle('on',t===1);document.getElementById('t2').classList.toggle('on',t===2);}
function zm(d){zoom=Math.max(11,Math.min(18,zoom+d));render();}
let drag=false,moved=false,sx=0,sy=0;
wEl.addEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON'){drag=true;moved=false;sx=e.clientX;sy=e.clientY;}});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>4||Math.abs(dy)>4)moved=true;if(!moved)return;sx=e.clientX;sy=e.clientY;const c=l2t(cLat,cLon,zoom),n=t2l(c.x-dx/256,c.y-dy/256,zoom);cLat=n.lat;cLon=n.lon;render();});
window.addEventListener('pointerup',e=>{if(!drag)return;drag=false;if(!moved&&e.target.tagName!=='BUTTON'){const r=wEl.getBoundingClientRect(),c=l2t(cLat,cLon,zoom),pos=t2l(c.x+(e.clientX-r.left-wEl.clientWidth/2)/256,c.y+(e.clientY-r.top-wEl.clientHeight/2)/256,zoom);setPoint(activeIdx,pos.lat,pos.lon,true);if(activeIdx<pts.length-1)activeIdx++;}});
async function setPoint(i,lat,lon,rev){pts[i]={lat,lon};render();if(!rev)return;stEl.textContent='Определяем адрес...';try{const r=await fetch(NOM+'reverse?format=json&lat='+lat+'&lon='+lon+'&accept-language=ru'),d=await r.json(),a=d.address||{},rd=a.road||a.pedestrian||a.suburb||'',hs=a.house_number?(', '+a.house_number):'';document.getElementById('in'+i).value=rd?(rd+hs):(lat.toFixed(5)+', '+lon.toFixed(5));stEl.textContent='Точка установлена';}catch{document.getElementById('in'+i).value=lat.toFixed(5)+', '+lon.toFixed(5);stEl.textContent='Координаты выбраны';}}
async function findAdr(i){const q=document.getElementById('in'+i).value.trim();if(!q)return;stEl.textContent='Поиск адреса...';try{const r=await fetch(NOM+'search?format=json&limit=1&q='+encodeURIComponent('Полевской, '+q)+'&accept-language=ru'),arr=await r.json();if(arr&&arr.length){cLat=parseFloat(arr[0].lat);cLon=parseFloat(arr[0].lon);pts[i]={lat:cLat,lon:cLon};render();stEl.textContent='Адрес найден';}else stEl.textContent='Адрес не найден';}catch{stEl.textContent='Ошибка поиска';}}
function addPt(){if(pts.length>=5)return alert('Максимум 5 точек');const i=pts.length;pts.push(null);const d=document.createElement('div');d.className='ir';d.innerHTML='<input id="in'+i+'" class="inp" placeholder="🟡 Точка '+i+'" onfocus="activeIdx='+i+'"><button class="sbtn" onclick="findAdr('+i+')">🔍</button>';document.getElementById('ptsBox').appendChild(d);activeIdx=i;}
function getGps(){if(!navigator.geolocation)return alert('Нет GPS');stEl.textContent='Ищем GPS...';navigator.geolocation.getCurrentPosition(p=>{cLat=p.coords.latitude;cLon=p.coords.longitude;setPoint(0,cLat,cLon,true);},()=>{stEl.textContent='Ошибка GPS';},{enableHighAccuracy:true,timeout:8000});}
function calcPrice(){let km=0;for(let i=0;i<pts.length-1;i++)if(pts[i]&&pts[i+1]){const R=6371,dLat=(pts[i+1].lat-pts[i].lat)*Math.PI/180,dLon=(pts[i+1].lon-pts[i].lon)*Math.PI/180,s=Math.sin(dLat/2)**2+Math.cos(pts[i].lat*Math.PI/180)*Math.cos(pts[i+1].lat*Math.PI/180)*Math.sin(dLon/2)**2;km+=R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))*1.25;}document.getElementById('p1').textContent=Math.max(150,Math.round((150+Math.max(0,km-2)*25)/5)*5)+' ₽';document.getElementById('p2').textContent=Math.max(225,Math.round((225+Math.max(0,km-2)*35)/5)*5)+' ₽';}
function sendOrd(){const a=[];for(let i=0;i<pts.length;i++){const v=document.getElementById('in'+i).value.trim();if(v)a.push(v);}if(a.length<2)return alert('Укажите адрес подачи и назначения!');const p={fr:a[0],to:a.slice(1).join(' -> '),tar:tar===1?'econom':'comfort',pr:document.getElementById(tar===1?'p1':'p2').textContent,ph:document.getElementById('phInp').value.trim()};if(tg&&tg.initData)tg.sendData(JSON.stringify(p));else alert('Тест заказа:\n'+JSON.stringify(p));}
window.addEventListener('resize',render);render();
</script></body></html>
