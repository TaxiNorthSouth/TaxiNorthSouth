<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<style>
body{font-family:sans-serif;margin:0;padding:8px;background:#f0f2f5}
.c{background:#fff;padding:10px;border-radius:14px;max-width:460px;margin:0 auto}
.r{display:flex;gap:6px;margin-bottom:8px}
.b{flex:1;padding:10px 4px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:700}
.on{border-color:#fc0;background:#fff9db}
#w{height:300px;background:#e5e9ec;border-radius:10px;margin-bottom:8px;border:2px solid #b0c4de;position:relative;overflow:hidden;touch-action:none}
.p{position:absolute;font-size:26px;transform:translate(-50%,-85%);pointer-events:none;z-index:5}
#st2{position:absolute;left:6px;bottom:6px;z-index:9;background:#fff;padding:2px 6px;border-radius:5px;font-size:11px}
.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:10px}
</style>
</head>
<body>
<div class="c">
<div class="r">
<button class="b on" id="b1" onclick="setP(1)">2ГИС</button>
<button class="b" id="b2" onclick="setP(2)">ArcGIS</button>
<button class="b" id="b3" onclick="setP(3)">OSM</button>
</div>
<div id="st" style="text-align:center;font-weight:700;margin-bottom:6px">Точка А: нажмите на карту</div>
<div id="w">
<div id="ly" style="position:absolute;inset:0"></div>
<div id="mA" class="p">🟢</div>
<div id="mB" class="p">🔴</div>
<div style="position:absolute;right:6px;top:6px;z-index:9"><button onclick="z++;draw()">+</button><button onclick="z--;draw()">-</button></div>
<div id="st2">Загрузка...</div>
</div>
<div class="r">
<button class="b on" id="btA" onclick="setM(1)">🟢 Точка А</button>
<button class="b" id="btB" onclick="setM(2)">🔴 Точка Б</button>
</div>
<div class="r">
<button class="b on" id="t1" onclick="setT(1)">Эконом <span id="p1">150 ₽</span></button>
<button class="b" id="t2" onclick="setT(2)">Комфорт <span id="p2">225 ₽</span></button>
</div>
<button class="go" onclick="st.textContent='Заказ принят!'">Заказать такси</button>
</div>
<script>
var m=1,pr=1,z=14,cLa=56.4475,cLn=60.1895,laA=56.4426,lnA=60.1819,laB=56.4530,lnB=60.1980;
var H='https://';
function getUrl(p,wx,ty,zm){
  if(p==1) return H+'tile0.maps.'+'://2gis.com;
  if(p==2) return H+'server.arcgisonline'+'.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/'+zm+'/'+ty+'/'+wx;
  return H+'tile.openstreetmap'+'.org/'+zm+'/'+wx+'/'+ty+'.png';
}
function px(la,ln){var n=1<<z,r=la*Math.PI/180;return{x:(ln+180)/360*n*256,y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n*256};}
function ll(x,y){var n=1<<z,a=Math.PI-2*Math.PI*y/(n*256);return{la:180/Math.PI*Math.atan(.5*(Math.exp(a)-Math.exp(-a))),ln:x/(n*256)*360-180};}
function setP(v){pr=v;b1.classList.toggle('on',v==1);b2.classList.toggle('on',v==2);b3.classList.toggle('on',v==3);draw();}
function setM(v){m=v;btA.classList.toggle('on',v==1);btB.classList.toggle('on',v==2);st.textContent=(v==1?'Точка А: нажмите на карту':'Точка Б: нажмите на карту');}
function setT(v){t1.classList.toggle('on',v==1);t2.classList.toggle('on',v==2);}
function draw(){
  var W=w.clientWidth||340,Ht=w.clientHeight||300,c=px(cLa,cLn),x0=c.x-W/2,y0=c.y-Ht/2,mx=1<<z,ok=0,er=0;
  ly.innerHTML='';
  var tx0=Math.floor(x0/256),tx1=Math.floor((x0+W)/256),ty0=Math.floor(y0/256),ty1=Math.floor((y0+Ht)/256);
  for(var tx=tx0;tx<=tx1;tx++){
    for(var ty=ty0;ty<=ty1;ty++){
      if(ty>=0 && mx>ty){
        var wx=((tx%mx)+mx)%mx,im=new Image();
        im.style.cssText='position:absolute;width:256px;height:256px;pointer-events:none;left:'+(tx*256-x0)+'px;top:'+(ty*256-y0)+'px';
        im.onload=function(){ok++;st2.textContent='Карта OK: '+ok;};
        im.onerror=function(){er++;st2.textContent='Ошибка: '+er;};
        im.src=getUrl(pr,wx,ty,z);
        ly.appendChild(im);
      }
    }
  }
  var a=px(laA,lnA),b=px(laB,lnB);
  mA.style.left=(a.x-x0)+'px';mA.style.top=(a.y-y0)+'px';
  mB.style.left=(b.x-x0)+'px';mB.style.top=(b.y-y0)+'px';
}
var sx=0,sy=0,mv=0,sla=0,sln=0;
w.onpointerdown=function(e){sx=e.clientX;sy=e.clientY;mv=0;sla=cLa;sln=cLn;};
w.onpointermove=function(e){if(sx){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>6||Math.abs(dy)>6)mv=1;if(mv){var c=px(sla,sln),p=ll(c.x-dx,c.y-dy);cLa=p.la;cLn=p.ln;draw();}}};
w.onpointerup=function(e){if(sx){if(mv==0){var r=w.getBoundingClientRect(),c=px(cLa,cLn),p=ll(c.x-r.width/2+e.clientX-r.left,c.y-r.height/2+e.clientY-r.top);if(m==1){laA=p.la;lnA=p.ln;setM(2);}else{laB=p.la;lnB=p.ln;}draw();var km=Math.hypot((laB-laA)*111,(lnB-lnA)*61)*1.3,v=Math.max(100,Math.round(80+km*28));p1.textContent=v+' ₽';p2.textContent=Math.round(v*1.5)+' ₽';}sx=0;}};
draw();
</script>
</body>
</html>
