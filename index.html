<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Такси Полевской</title>
<link rel="stylesheet" href="https://unpkg.com"/>
<script src="https://unpkg.com"></script>
<style>
body{font-family:sans-serif;margin:0;padding:10px;background:#f0f2f5}
.card{background:#fff;padding:12px;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.1);max-width:460px;margin:0 auto}
.tabs{display:flex;gap:4px;margin-bottom:10px;background:#eee;padding:4px;border-radius:10px}
.tab{flex:1;padding:8px 4px;border:none;border-radius:8px;background:0 0;font-size:12px;font-weight:700;color:#555}
.tab.active{background:#fff;color:#000;box-shadow:0 1px 4px rgba(0,0,0,.15)}
#wrap{height:300px;background:#e5e9ec;border-radius:12px;margin-bottom:10px;border:2px solid #b0c4de;position:relative;overflow:hidden}
.box{width:100%;height:100%;position:absolute;top:0;left:0;display:none}
.box.show{display:block}
#ymap-msg{padding:14px;text-align:center;font-size:12px;color:#333;margin-top:45px;line-height:1.4;word-break:break-word}
.row{display:flex;gap:8px;margin-bottom:8px}
.btn{flex:1;padding:11px 6px;border:2px solid #ddd;border-radius:10px;background:#fff;font-size:13px;font-weight:700}
.btn.active{border-color:#fc0;background:#fff9db}
.go{width:100%;background:#fc0;border:none;padding:14px;font-size:16px;font-weight:700;border-radius:12px}
.pin{position:absolute;font-size:28px;transform:translate(-50%,-50%);pointer-events:none;z-index:5}
#scar{transition:left .15s linear,top .15s linear;display:none;z-index:6;font-size:30px}
</style>
</head>
<body>
<div class="card">
<div class="tabs">
<button class="tab active" id="t-yandex" onclick="sw('yandex')">Яндекс</button>
<button class="tab" id="t-2gis" onclick="sw('2gis')">2ГИС</button>
<button class="tab" id="t-arcgis" onclick="sw('arcgis')">ArcGIS</button>
<button class="tab" id="t-svg" onclick="sw('svg')">Схема</button>
</div>
<div id="st" style="margin-bottom:8px;font-weight:700;text-align:center;font-size:14px">Нажмите на карту для Точки А</div>
<div id="wrap">
<div id="b-yandex" class="box show"><div id="ymap-msg">Загрузка Яндекс.Карт...</div></div>
<div id="b-leaflet" class="box"></div>
<div id="b-svg" class="box" onclick="tapSvg(event)">
<svg viewBox="0 0 400 300" preserveAspectRatio="none" style="width:100%;height:100%;display:block;pointer-events:none">
<rect width="400" height="300" fill="#f3f4ef"/>
<path d="M0,125 Q65,115 95,150 T60,210 L0,200 Z" fill="#aadaff"/>
<line x1="195" y1="0" x2="195" y2="300" stroke="#f7d36f" stroke-width="11"/>
<line x1="0" y1="95" x2="400" y2="95" stroke="#f7d36f" stroke-width="10"/>
<line x1="95" y1="170" x2="400" y2="170" stroke="#f7d36f" stroke-width="10"/>
<text x="198" y="75" font-size="9" fill="#555" transform="rotate(90 198,75)">ул. Коммунистическая</text>
<text x="130" y="98" font-size="9" fill="#555">ул. Ленина</text>
<text x="215" y="173" font-size="9" fill="#555">ул. Карла Маркса</text>
</svg>
<div id="sA" class="pin" style="left:32%;top:68%">🟢</div>
<div id="sB" class="pin" style="left:72%;top:31%">🔴</div>
<div id="scar" class="pin">🚕</div>
</div>
</div>
<div class="row">
<button id="bA" class="btn active" onclick="setM('A')">🟢 Точка А</button>
<button id="bB" class="btn" onclick="setM('B')">🔴 Точка Б</button>
</div>
<div class="row">
<button id="t1" class="btn active" onclick="setT('t1')">Эконом<br><span id="p1">150 ₽</span></button>
<button id="t2" class="btn" onclick="setT('t2')">Комфорт<br><span id="p2">225 ₽</span></button>
</div>
<button id="obtn" class="go" onclick="go()">Заказать такси</button>
</div>
<script>
var KEY='2738e3ad-b2a6-4dec-b0c6-0bcf3323d2ad',m='A',tmr=null,latA=56.4426,lngA=60.1819,latB=56.4530,lngB=60.1980,sA={x:32,y:68},sB={x:72,y:31};
var yMap=null,yMkA,yMkB,yLn,yCar,yLoad=false,lMap=null,lLay=null,lMkA,lMkB,lLn,lCar;

function logY(msg){
  var el=document.getElementById('ymap-msg');
  if(el) el.innerHTML=msg+'<br><small style="color:#666">Домен: '+location.origin+'</small>';
}

function sw(e){
var ids=['yandex','2gis','arcgis','svg'];
for(var i=0;i<4;i++){
  var id=ids[i];
  document.getElementById('t-'+id).className=(id===e)?'tab active':'tab';
}
document.getElementById('b-yandex').className=(e==='yandex')?'box show':'box';
document.getElementById('b-leaflet').className=(e==='2gis'||e==='arcgis')?'box show':'box';
document.getElementById('b-svg').className=(e==='svg')?'box show':'box';
if(e==='yandex')initY();
if(e==='2gis'||e==='arcgis')initL(e);
}

function initY(){
if(yMap){yMap.container.fitToViewport();return;}
if(yLoad)return;
yLoad=true;
logY('1/3 Загружаем скрипт api-maps.yandex.ru...');
var s=document.createElement('script');
s.src='https://yandex.ru';
s.onerror=function(){
  logY('❌ Скрипт Яндекса не загрузился (ошибка сети или блокировка).');
};
s.onload=function(){
  logY('2/3 Скрипт загружен, ждём ymaps.ready...');
  if(typeof ymaps==='undefined'){logY('❌ ymaps не определён');return;}
  ymaps.ready(function(){
    document.getElementById('b-yandex').innerHTML='';
    yMap=new ymaps.Map('b-yandex',{center:[latA,lngA],zoom:14,controls:['zoomControl']});
    yMkA=new ymaps.Placemark([latA,lngA],{},{preset:'islands#greenDotIcon'});
    yMkB=new ymaps.Placemark([latB,lngB],{},{preset:'islands#redDotIcon'});
    yLn=new ymaps.Polyline([[latA,lngA],[latB,lngB]],{},{strokeColor:'#222',strokeWidth:4});
    yMap.geoObjects.add(yMkA);
    yMap.geoObjects.add(yMkB);
    yMap.geoObjects.add(yLn);
    yMap.events.add('click',function(e){
      var c=e.get('coords');
      upd(c,c);
    });
  },function(err){
    logY('❌ Яндекс отклонил ключ или домен: '+JSON.stringify(err));
  });
};
document.head.appendChild(s);
}

function initL(type){
if(typeof L==='undefined'){
  alert('Библиотека Leaflet (unpkg.com) не загрузилась. Проверьте интернет или VPN.');
  return;
}
if(!lMap){
  lMap=L.map('b-leaflet').setView([latA,lngA],14);
  lMkA=L.circleMarker([latA,lngA],{radius:10,color:'#1e8449',fillColor:'#2ecc71',fillOpacity:1}).addTo(lMap);
  lMkB=L.circleMarker([latB,lngB],{radius:10,color:'#922b21',fillColor:'#e74c3c',fillOpacity:1}).addTo(lMap);
  lLn=L.polyline([[latA,lngA],[latB,lngB]],{color:'#222',weight:4}).addTo(lMap);
  lMap.on('click',function(e){upd(e.latlng.lat,e.latlng.lng);});
}
if(lLay)lMap.removeLayer(lLay);
var u=(type==='2gis')
  ?'https://tile{s}://{x}&y={y}&z={z}&v=1'
  :'https://arcgisonline.com{z}/{y}/{x}';
lLay=L.tileLayer(u,{subdomains:'0123',maxZoom:18}).addTo(lMap);
setTimeout(function(){lMap.invalidateSize()},250);
}

function upd(lat,lng){
if(m==='A'){latA=lat;lngA=lng;setM('B');}else{latB=lat;lngB=lng;}
if(yMap){
  yMkA.geometry.setCoordinates([latA,lngA]);
  yMkB.geometry.setCoordinates([latB,lngB]);
  yLn.geometry.setCoordinates([[latA,lngA],[latB,lngB]]);
}
if(lMap){
  lMkA.setLatLng([latA,lngA]);
  lMkB.setLatLng([latB,lngB]);
  lLn.setLatLngs([[latA,lngA],[latB,lngB]]);
}
var km=Math.sqrt(Math.pow((latB-latA)*111,2)+Math.pow((lngB-lngA)*61,2))*1.3;
var pr=Math.max(100,Math.round(80+km*28));
document.getElementById('p1').innerText=pr+' ₽';
document.getElementById('p2').innerText=Math.round(pr*1.5)+' ₽';
}

function tapSvg(e){
var r=document.getElementById('b-svg').getBoundingClientRect(),
    x=Math.round(((e.clientX-r.left)/r.width)*100),
    y=Math.round(((e.clientY-r.top)/r.height)*100);
if(m==='A'){sA={x:x,y:y};document.getElementById('sA').style.left=x+'%';document.getElementById('sA').style.top=y+'%';setM('B');}
else{sB={x:x,y:y};document.getElementById('sB').style.left=x+'%';document.getElementById('sB').style.top=y+'%';}
var pr=Math.max(100,Math.round(80+Math.sqrt(Math.pow(sB.x-sA.x,2)+Math.pow(sB.y-sA.y,2))*2));
document.getElementById('p1').innerText=pr+' ₽';
document.getElementById('p2').innerText=Math.round(pr*1.5)+' ₽';
}

function setM(v){m=v;document.getElementById('bA').className=v==='A'?'btn active':'btn';document.getElementById('bB').className=v==='B'?'btn active':'btn';document.getElementById('st').innerText=v==='A'?'Нажмите на карту для Точки А':'Нажмите на карту для Точки Б';}
function setT(id){document.getElementById('t1').className=id==='t1'?'btn active':'btn';document.getElementById('t2').className=id==='t2'?'btn active':'btn';}

function go(){
var b=document.getElementById('obtn');
if(b.innerText==='Отменить заказ'){
  clearInterval(tmr);
  if(yCar&&yMap)yMap.geoObjects.remove(yCar);
  if(lCar&&lMap)lMap.removeLayer(lCar);
  document.getElementById('scar').style.display='none';
  b.innerText='Заказать такси';
  setM('A');
  return;
}
b.innerText='Ищем машину...';
setTimeout(function(){
  b.innerText='Отменить заказ';
  document.getElementById('st').innerText='Машина выехала к точке А!';
  var sx=latA+0.006,sy=lngA+0.006,s=0;
  if(yMap){yCar=new ymaps.Placemark([sx,sy],{},{preset:'islands#yellowAutoIcon'});yMap.geoObjects.add(yCar);}
  if(lMap){lCar=L.circleMarker([sx,sy],{radius:11,color:'#b7950b',fillColor:'#fc0',fillOpacity:1}).addTo(lMap);}
  var sc=document.getElementById('scar'),fx=sA.x>50?sA.x-25:sA.x+25,fy=sA.y>50?sA.y-25:sA.y+25;
  sc.style.left=fx+'%';sc.style.top=fy+'%';sc.style.display='block';
  tmr=setInterval(function(){
    s++;
    var cx=sx+(latA-sx)*(s/25),cy=sy+(lngA-sy)*(s/25);
    if(yCar)yCar.geometry.setCoordinates([cx,cy]);
    if(lCar)lCar.setLatLng([cx,cy]);
    sc.style.left=(fx+(sA.x-fx)*(s/25))+'%';
    sc.style.top=(fy+(sA.y-fy)*(s/25))+'%';
    if(s>=25){clearInterval(tmr);document.getElementById('st').innerText='Водитель на месте! Выходите';}
  },150);
},1200);
}
initY();
</script>
</body>
</html>
